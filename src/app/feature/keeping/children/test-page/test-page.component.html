<div  class="section full-absolute scroll-y">



  <!-- 이미지 슬라이더 순서 편집 생성 - 테스트 진행중 -->
  <div
    cdkDropList cdkDropListOrientation="horizontal" class="example-list" (cdkDropListDropped)="dropEvent($event)">
    이미지 순서 변경
      <div class="example-box"
           cdkDrag
           *ngFor="let timePeriod of timePeriods">
          <img [src]="timePeriod" alt="">
      </div>
  </div>

  <div class="write-swiper">
    슬라이드
    <swiper
      (swiper)="thumbsSwiper = $event"
      [spaceBetween]="10"
      [slidesPerView]="4"
      [freeMode]="true"
      [watchSlidesProgress]="false"
      class="mySwiper"
    >
      <ng-template *ngFor="let timePeriod of timePeriods" swiperSlide>
        <div class="example-box">
          <img [src]="timePeriod" alt="">
        </div>
      </ng-template>
    </swiper>

    <swiper
      style="--swiper-navigation-color: #fff;--swiper-pagination-color: #fff"
      [spaceBetween]="10"
      [navigation]="true"
      [thumbs]="{ swiper: thumbsSwiper }"
      class="mySwiper2"
    >
      <ng-template *ngFor="let timePeriod of timePeriods" swiperSlide>
        <img [src]="timePeriod" alt="">
      </ng-template>
    </swiper>

  </div>
</div>
