<!-- 타이틀 -->
<div class="items-title">
  <div class="title">
    <span class="title-content">피드</span>
    <span class="content-count">{{feeds.length | number}}</span>
  </div>

  <a class="more-view">
    전체보기
  </a>
</div>

<!-- 등록한 피드 없을 때 -->
<div class="items" *ngIf="feeds.length === 0">
  <div class="item-empty">
    <div class="item-empty-title">
      {{ 'mypage.empty-text-1' | translate }}
    </div>
    <div class="item-empty-content">
      {{('mypage.empty-text-2' | translate)}}
    </div>
    <div class="item-empty-btns">
      <button type="button" (click)="goRouter('/write')">
        <span [inlineSVG]="'assets/icons/mypage/write_port.svg'"></span>
        <div>{{ 'mypage.write' | translate }}</div>
      </button>
    </div>
  </div>
</div>
