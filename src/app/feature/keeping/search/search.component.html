<div (click)="back()">뒤로가기</div>

<shared-input
  label="라벨텍스트"
  placeholder="텍스트를 입력하세요"
  [(ngModel)]="text"
  (ngModelChange)='getTagList()'
  info="설명을 입력해 주세요"
></shared-input>
<div class="shared-button-primary" (click)='getTagList()'>
  <div>검색</div>
</div>

<ul class="list-group" *ngFor='let tag of tagList'>
  <li class="list-group-item d-flex justify-content-between align-items-center">
    {{tag.name}}
    <span class="badge badge-primary badge-pill">{{tag.tagCount}}</span>
  </li>
</ul>
