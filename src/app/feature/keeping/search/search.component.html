<div class='search full-absolute d-flex flex-column'>
  <header class="d-block" style="z-index: 1;"></header>
  <div class="flex-fill" style="position: relative">
    <ng-container *ngTemplateOutlet='search'></ng-container>
  </div>
</div>

<ng-template #search>
  <shared-input
    label="라벨텍스트"
    placeholder="텍스트를 입력하세요"
    [(ngModel)]="text"
    (ngModelChange)='getTagList()'
    info="설명을 입력해 주세요"
  ></shared-input>
  <div class="shared-button-primary" (click)='getTagList()'>
    <div>검색</div>
  </div>

  피드
  <ul class="list-group" *ngFor='let tag of feedTagList'>

    <li class="list-group-item d-flex justify-content-between align-items-center">
      {{tag.name}}
      <span class="badge badge-primary badge-pill">{{tag.tagCount}}</span>
    </li>
  </ul>

  매거진
  <ul class="list-group" *ngFor='let tag of magazineTagList'>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      {{tag.nameKo}} / / / {{tag.nameEn}}
      <span class="badge badge-primary badge-pill">{{tag.tagCount}}</span>
    </li>
  </ul>
</ng-template>
