<div class='search full-absolute d-flex flex-column'>
  <header class="d-block" style="z-index: 1;"></header>
  <div class="flex-fill" style="position: relative">
    <ng-container *ngTemplateOutlet='search'></ng-container>
  </div>
</div>

<ng-template #search>
  <div class='section full-absolute d-flex flex-fill scroll-y' #scrollEl>
    <!--    <nav class="d-none d-lg-block"></nav>-->
    <div class='pc-nav d-none d-lg-block'>
      <div class='nav-section d-flex flex-column'>
        <a class='btn-open-nav' role='button' data-toggle='collapse' href='#nav-collapse' aria-expanded='true' aria-controls='nav-collapse'>
          <img src='/assets/icons/common/scrap_icon.png' alt=''>
          <div class='text'>
            {{'common.service-name.scrap' | translate}}
          </div>
          <img class='arrow' src='/assets/images/common/arrow_menu.png' alt=''>
        </a>
        <div class='nav collapse show' id='nav-collapse'>
          <a class='menu' [routerLink]="['/search/feed']" routerLinkActive="selected">
            <div class='text'>
              {{'common.service-name.feed' | translate}}
            </div>
          </a>
          <a class='menu' [routerLink]="['/search/magazine']" routerLinkActive="selected">
            <div class='text'>
              {{'common.service-name.magazine' | translate}}
            </div>
          </a>
        </div>
      </div>
    </div>

    <div class='' style='position: relative'>
      <div class='contents flex-fill d-flex flex-column'>
        <shared-input
          label="라벨텍스트"
          placeholder="텍스트를 입력하세요"
          [(ngModel)]="text"
          (ngModelChange)='getTagList()'
          info="설명을 입력해 주세요"
        ></shared-input>
        <div class="shared-button-primary" (click)='getTagList()'>
          <div>검색</div>
        </div>

        태그 목록
        <ul class="list-group" *ngFor='let tag of tagList'>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            {{tag.nameKo}} / / / {{tag.nameEn}}
            <span class="badge badge-primary badge-pill">{{tag.feedCount}}</span>
            <span class="badge badge-primary badge-pill">{{tag.magazineCount}}</span>
          </li>
        </ul>
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</ng-template>
