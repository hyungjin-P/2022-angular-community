<div class="header">
    <div class="leading">
        <div class="burger-menu d-none d-lg-flex" (click)="openNav()">
            <img src="assets/icons/nav/burger-menu.svg" />
        </div>
        <div class="logo">
            <img src="assets/images/logo/header_logo.svg" [routerLink]="['/']" />
        </div>
    </div>
    <div class="center"></div>
    <div class="action">
        <div class="search d-flex d-xl-none">
            <svg class="svg-icon" [routerLink]="['/search']">
                <use xlink:href="assets/icons/header/search.svg#icon" />
            </svg>
        </div>
        <ng-container *ngIf="!variables.isLogin">
            <div class="login d-none d-lg-flex" [routerLink]="['/auth/login']">
                <span class="shared-typo-body-b14">로그인</span>
            </div>
            <div class="registration d-none d-lg-flex" [routerLink]="['/auth/registration']">
                <span class="shared-typo-body-b14">회원가입</span>
            </div>
        </ng-container>
        <ng-container *ngIf="variables.isLogin">
            <div class="notification">
                <svg class="svg-icon">
                    <use xlink:href="assets/icons/header/notification.svg#icon" />
                </svg>
                <div class="dot"></div>
            </div>
            <div class="user d-none d-lg-flex" (click)="openUserMenu($event)">
                <div class="avatar">
                    <shared-avatar
                        [image]="user.picture"
                        text="{{ user.email }}"
                        size="29"
                        fontSize="18"
                    ></shared-avatar>
                    <div class="dot"></div>
                </div>
                <div class="email">
                    <span class="shared-typo-body-b14">{{ user.email }}</span>
                </div>
                <span class="mdi mdi-chevron-down"></span>
                <div
                    class="user-menu"
                    [class.d-flex]="userMenuVisible"
                    (click)="$event.stopPropagation()"
                    (sharedClickOutside)="closeUserMenu()"
                ></div>
            </div>
            <div class="vertical-line d-none d-lg-flex"></div>
            <div class="write d-none d-lg-flex">
                <img src="assets/icons/header/pencil.svg" />
                <span class="shared-typo-body-b14">글쓰기</span>

                <span class="mdi mdi-chevron-down"></span>
            </div>
        </ng-container>
    </div>
</div>
