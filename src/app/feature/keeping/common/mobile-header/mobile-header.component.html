<!-- 모바일 전용 심플 헤더 -->

<div
  class="header"
  [ngStyle]="{'box-shadow' : getBoxShadow()}"
>
    <div class="mdi mdi-chevron-left" (click)="_goBack()"></div>
    <div>{{ text }}</div>
</div>

<!-- 카테고리 탭 -->
<ng-container *ngIf="tabMenu.length > 0">
  <div class="nav">
    <ng-container *ngFor="let tab of tabMenu">
      <div class="menu" [ngClass]="tab?.tabName === nowTab ? 'selected' : ''">
        <a class="text" href="javascript: void(0);" (click)="moveTab(tab?.link)">
          {{ tab?.languageCode | translate }}
        </a>
        <div class="selected-line"></div>
      </div>
    </ng-container>
  </div>
</ng-container>
