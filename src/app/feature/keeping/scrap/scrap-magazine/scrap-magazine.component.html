<div class="section">
  <!-- 타이틀 -->
  <div class="items-title">
    <div class="title">
      <span class="title-content">{{ 'common.service-name.magazine' | translate }}</span>
      <span class="content-count">{{ magazineList?.length | number }}</span>
    </div>

    <a class="delete-all" *ngIf="magazineList?.length > 0" (click)='showConfirmModal()'>
      <img src="assets/icons/etc/trash-delete.svg" alt="" />
      {{ 'keeping.scrap.delete-all' | translate }}
    </a>
  </div>

  <!-- 등록한 피드 없을 때 -->
  <div class="items" *ngIf="magazineList?.length === 0">
    <div class="item-empty">
      <div class="item-empty-title">
        {{ 'mypage.empty-text-1' | translate }}
      </div>
      <div class="item-empty-content">
        {{ 'mypage.empty-text-2' | translate }}
      </div>
    </div>
  </div>

  <!-- 등록한 피드 있을 때 -->
  <div class="items" *ngIf="magazineList?.length > 0">
    <!-- 사진 있는 것-->
    <div class="item" *ngFor="let magazine of magazineList">
      <div class="item-box d-flex flex-column flex-wrap">
        <img class="picture" [src]="magazine.picture" [alt]="" (click)="moveMagazineDetail(magazine)">
        <div class='gradient'></div>
        <a class='bookmark' [ngClass]="magazine.isBookmark ? 'active' : ''" (click)='toggleBookmark(magazine)'>
          <ng-container *ngIf='!variables.isLogin || !magazine.isBookmark'>
            <img src='/assets/icons/mypage/bookmark-default.svg' alt=''>
          </ng-container>
          <ng-container *ngIf='variables.isLogin && magazine.isBookmark'>
            <img src='/assets/icons/mypage/bookmark-active.svg' alt=''>
          </ng-container>
        </a>
        <div class='description' (click)="moveMagazineDetail(magazine)">
          <div class='category'>
            {{'common.nav.magazine-tab.' + magazine.category | translate}}
          </div>
          <div class='title'>
            {{magazine.body.title}}
          </div>
        </div>
      </div>
      <!--<div class="item-content">

        </div>-->
    </div>

    <!-- 사진 없는 것 6개까지 증축하기 -->
    <ng-container *ngIf='magazineList?.length <= 6'>
      <div class="item" *ngFor="let dummy of ' '.repeat(6 - magazineList.length).split(''); let x = index">
        <div class="item-box"></div>
        <!--<div class="item-content">
          </div>-->
      </div>
    </ng-container>

    <!-- 사진이 6개 이상일 때 나머지 빈칸 자동 생성 -->
    <ng-container *ngIf='magazineList?.length > 6'>
      <div class='item' *ngFor="let dummy of ' '.repeat(2 - (magazineList.length % 2)).split(''); let x = index">
        <div class="item-box"></div>
      </div>
    </ng-container>
  </div>
</div>

<shared-modal
  [(visible)]="isConfirmModalVisible"
  [data]="confirmModalData"
  type="confirm"
  (cancel)="confirmModalCancel()"
  (confirm)="confirmModalOk()"
></shared-modal>
