<div class="section">

  <app-feed-detail-modal
    (prev)="feedDetailModalPrev()"
    (next)="feedDetailModalNext()"
    #feedDetailModal
  ></app-feed-detail-modal>

  <!-- 타이틀 -->
  <div class="items-title">
    <div class="title">
      <span class="title-content">{{ 'common.service-name.feed' | translate }}</span>
      <span class="content-count">{{ totalCount ? totalCount : 0 | number }}</span>
    </div>

    <a class="delete-all" *ngIf="feedBookmarkList?.length > 0" (click)='showConfirmModal()'>
      <img src="assets/icons/etc/trash-delete.svg" alt="" />
      {{ 'keeping.scrap.delete-all' | translate }}
    </a>
  </div>

  <div class='item-section'>
    <!-- 등록한 피드 없을 때 -->
    <div class="item-empty" *ngIf="feedBookmarkList?.length === 0">
      <div class="item-empty-content">
        {{ 'keeping.scrap.undefined-comment' | translate }}
      </div>
    </div>

    <!-- 등록한 피드 있을 때 -->
    <div class="items" *ngIf="feedBookmarkList?.length > 0">
      <!-- 사진 있는 것-->
      <div class="item" *ngFor="let feedBookmark of feedBookmarkList">
        <div class="item-box d-flex flex-column flex-wrap">
          <img class="picture" [src]="feedBookmark.feed.picture" [alt]="feedBookmark.feed.content" (click)="feedDetailModalShow(feedBookmark.feed.id)">
          <a class='bookmark' [ngClass]="feedBookmark.feed.isBookmark ? 'active' : ''" (click)='toggleBookmark(feedBookmark.feed)'>
            <ng-container *ngIf='!variables.isLogin || !feedBookmark.feed.isBookmark'>
              <img src='/assets/icons/mypage/bookmark-default.svg' alt=''>
            </ng-container>
            <ng-container *ngIf='variables.isLogin && feedBookmark.feed.isBookmark'>
              <img src='/assets/icons/mypage/bookmark-active.svg' alt=''>
            </ng-container>
          </a>
        </div>
        <!--<div class="item-content">

          </div>-->
      </div>

      <ng-container *ngIf="viewType === 'desktop'">
        <!-- 사진 없는 것 12개까지 증축하기 -->
        <ng-container *ngIf='feedBookmarkList?.length <= 12'>
          <div class="item" *ngFor="let dummy of ' '.repeat(12 - feedBookmarkList.length).split(''); let x = index">
            <div class="item-box"></div>
            <!--<div class="item-content">
              </div>-->
          </div>
        </ng-container>

        <!-- 사진이 12개 이상일 때 나머지 빈칸 자동 생성 -->
        <ng-container *ngIf='feedBookmarkList?.length > 12 && feedBookmarkList?.length % 4 !== 0'>
          <div class='item' *ngFor="let dummy of ' '.repeat(4 - (feedBookmarkList.length % 4)).split(''); let x = index">
            <div class="item-box"></div>
          </div>
        </ng-container>
      </ng-container>

      <ng-container *ngIf="viewType === 'mobile'">
        <!-- 사진 없는 것 6개까지 증축하기 -->
        <ng-container *ngIf='feedBookmarkList?.length <= 6'>
          <div class="item" *ngFor="let dummy of ' '.repeat(6 - feedBookmarkList.length).split(''); let x = index">
            <div class="item-box"></div>
            <!--<div class="item-content">
              </div>-->
          </div>
        </ng-container>

        <!-- 사진이 6개 이상일 때 나머지 빈칸 자동 생성 -->
        <ng-container *ngIf='feedBookmarkList?.length > 6 && feedBookmarkList?.length % 2 !== 0'>
          <div class='item' *ngFor="let dummy of ' '.repeat(2 - (feedBookmarkList.length % 2)).split(''); let x = index">
            <div class="item-box"></div>
          </div>
        </ng-container>
      </ng-container>
    </div>

    <div class='shared-button-outline d-none d-lg-flex' *ngIf='pageLink?.next && feedBookmarkList?.length > 0' (click)='findNextPage()'>
      {{'keeping.scrap.more' | translate}}
    </div>
  </div>
</div>


<shared-modal
  [(visible)]="isConfirmModalVisible"
  [data]="confirmModalData"
  type="confirm"
  (cancel)="confirmModalCancel()"
  (confirm)="confirmModalOk()"
></shared-modal>
