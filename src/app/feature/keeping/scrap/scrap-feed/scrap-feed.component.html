<div class="section">
  <!-- 타이틀 -->
  <div class="items-title">
    <div class="title">
      <span class="title-content">{{ 'common.service-name.feed' | translate }}</span>
      <span class="content-count">{{ feedList?.length | number }}</span>
    </div>

    <a class="delete-all" *ngIf="feedList?.length > 0" (click)='showConfirmModal()'>
      <img src="assets/icons/etc/trash-delete.svg" alt="" />
      {{ 'keeping.scrap.delete-all' | translate }}
    </a>
  </div>

  <!-- 등록한 피드 없을 때 -->
  <div class="items" *ngIf="feedList?.length === 0">
    <div class="item-empty">
      <div class="item-empty-title">
        {{ 'mypage.empty-text-1' | translate }}
      </div>
      <div class="item-empty-content">
        {{ 'mypage.empty-text-2' | translate }}
      </div>
      <div class="item-empty-btns">
        <button type="button" (click)="goRouter('/write')">
          <span [inlineSVG]="'assets/icons/mypage/write_port.svg'"></span>
          <div>{{ 'mypage.write' | translate }}</div>
        </button>
      </div>
    </div>
  </div>

  <!-- 등록한 피드 있을 때 -->
  <div class="items d-flex flex-wrap" *ngIf="feedList?.length > 0">
    <!-- 사진 있는 것-->
    <div class="item col-6 col-lg-3" *ngFor="let feed of feedList">
      <div class="item-box d-flex flex-column flex-wrap">
        <img class="picture" [src]="feed.picture" [alt]="feed.content" (click)="moveFeedDetail(feed)">
        <a class='bookmark' [ngClass]="feed.isBookmark ? 'active' : ''" (click)='toggleBookmark(feed)'>
          <ng-container *ngIf='!variables.isLogin || !feed.isBookmark'>
            <img src='/assets/icons/mypage/bookmark-default.svg' alt=''>
          </ng-container>
          <ng-container *ngIf='variables.isLogin && feed.isBookmark'>
            <img src='/assets/icons/mypage/bookmark-active.svg' alt=''>
          </ng-container>
        </a>
      </div>
      <!--<div class="item-content">

        </div>-->
    </div>

    <!-- 사진 없는 것 12개까지 증축하기 -->
    <div class="item col-6 col-lg-3" *ngFor="let dummy of ' '.repeat(12 - feedList?.length).split(''); let x = index">
      <div class="item-box"></div>
      <!--<div class="item-content">
        </div>-->
    </div>
  </div>
</div>


<shared-modal
  [(visible)]="isConfirmModalVisible"
  [data]="confirmModalData"
  type="confirm"
  (cancel)="confirmModalCancel()"
  (confirm)="confirmModalOk()"
></shared-modal>
