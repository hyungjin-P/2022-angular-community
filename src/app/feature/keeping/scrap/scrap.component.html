<div class='scrap full-absolute d-flex flex-column'>
  <header class="d-none d-lg-block" style="z-index: 1;"></header>
  <mobile-header class='d-block d-lg-none' [text]="selectLanguage === 'ko' ? '스크랩' : 'Scrap'" (goBack)='goBack()'></mobile-header>

  <div class="flex-fill" style="position: relative">
    <ng-container *ngTemplateOutlet='scrap'></ng-container>
  </div>
</div>

<ng-template #scrap>
  <div class='section full-absolute d-flex flex-fill'>
<!--    <nav class="d-none d-lg-block"></nav>-->
    <div class='pc-nav d-none d-lg-block'>
      <div class='nav-section'>
        <div class='nav'>

        </div>
      </div>
    </div>

    <div class='' style='position: relative'>
      <div class='contents flex-fill d-flex flex-column'>

        <div class='contents-text d-none d-lg-block'>
          <div class='contents-text-title'>
            📌{{'common.service-name.scrap' | translate}}
          </div>
          <div class='contents-text-comment'>
            {{'keeping.scrap.comment' | translate}}
          </div>
        </div>
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</ng-template>
