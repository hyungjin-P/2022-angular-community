<div class="full-absolute user-select-none">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <img src="assets/images/logo/header_logo.svg" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="reset-password-form">
        <div class="container">
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <ng-container *ngTemplateOutlet="text1"></ng-container>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-2 shared-typo-desc-r12">새로 사용할 비밀번호를 입력해 주세요.</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="password">
                        <shared-input
                            type="text"
                            label="비밀번호"
                            placeholder="비밀번호를 입력해 주세요"
                            [(ngModel)]="password"
                            maxlength="15"
                            *ngIf="passwordVisible"
                            [error]="password != '' && passwordErrorText"
                            (keyup)="onKeyup($event, 'password')"
                        ></shared-input>
                        <img
                            class="password-icon-visible"
                            src="assets/icons/etc/eye-visible.svg"
                            (click)="changePasswordVisible()"
                            *ngIf="passwordVisible"
                        />

                        <shared-input
                            type="password"
                            label="비밀번호"
                            placeholder="비밀번호를 입력해 주세요"
                            [(ngModel)]="password"
                            maxlength="15"
                            *ngIf="!passwordVisible"
                            [error]="password != '' && passwordErrorText"
                            (keyup)="onKeyup($event, 'password')"
                        ></shared-input>
                        <img
                            class="password-icon-invisible"
                            src="assets/icons/etc/eye-invisible.svg"
                            (click)="changePasswordVisible()"
                            *ngIf="!passwordVisible"
                        />
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="confirm-password">
                        <shared-input
                            type="text"
                            label="비밀번호 확인"
                            placeholder="비밀번호를 입력해 주세요"
                            [(ngModel)]="confirmPassword"
                            maxlength="15"
                            *ngIf="confirmPasswordVisible"
                            [error]="confirmPassword != '' && confirmPasswordErrorText"
                            (keyup)="onKeyup($event, 'confirmPassword')"
                        ></shared-input>
                        <img
                            class="password-icon-visible"
                            src="assets/icons/etc/eye-visible.svg"
                            (click)="changeConfirmPasswordVisible()"
                            *ngIf="confirmPasswordVisible"
                        />

                        <shared-input
                            type="password"
                            label="비밀번호 확인"
                            placeholder="비밀번호를 입력해 주세요"
                            [(ngModel)]="confirmPassword"
                            maxlength="15"
                            *ngIf="!confirmPasswordVisible"
                            [error]="confirmPassword != '' && confirmPasswordErrorText"
                            (keyup)="onKeyup($event, 'confirmPassword')"
                        ></shared-input>
                        <img
                            class="password-icon-invisible"
                            src="assets/icons/etc/eye-invisible.svg"
                            (click)="changeConfirmPasswordVisible()"
                            *ngIf="!confirmPasswordVisible"
                        />
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <!-- <div class="send-reset-password-link-button">
                        <div
                            shared-button
                            sharedButtonType="primary"
                            sharedButtonSize="medium"
                            sharedButtonHeight="52"
                            [sharedButtonDisabled]="
                                !isTokenValid || !passwordValid || !confirmPasswordValid || password != confirmPassword
                            "
                            (click)="changePassword()"
                        >
                            <div>설정 완료</div>
                        </div>
                    </div> -->
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #text1>
    <div class="d-sm-none text-1 shared-typo-title-b24">비밀번호 재설정</div>
    <div class="d-none d-sm-block text-1 shared-typo-title-b26">비밀번호 재설정</div>
</ng-template>
