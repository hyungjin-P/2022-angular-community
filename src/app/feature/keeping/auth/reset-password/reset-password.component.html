<div class="full-absolute user-select-none">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <a class="logo" [routerLink]="['/']">
                            <img src="assets/images/logo/mobile_header_logo.png.png" />
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="reset-password-form">
        <div class="container">
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-1">{{ 'auth.reset-password.text1' | translate }}</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-2">{{ 'auth.reset-password.text2' | translate }}</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="password">
                        <shared-input
                            type="text"
                            [label]="'auth.reset-password.password-label' | translate"
                            [placeholder]="'auth.reset-password.password-placeholder' | translate"
                            [(ngModel)]="password"
                            maxlength="15"
                            *ngIf="passwordVisible"
                            [error]="password != '' && passwordErrorText"
                            (keyup)="onKeyup($event, 'password')"
                        ></shared-input>
                        <img
                            class="password-icon-visible"
                            src="assets/icons/etc/eye-visible.svg"
                            (click)="changePasswordVisible()"
                            *ngIf="passwordVisible"
                        />

                        <shared-input
                            type="password"
                            [label]="'auth.reset-password.password-label' | translate"
                            [placeholder]="'auth.reset-password.password-placeholder' | translate"
                            [(ngModel)]="password"
                            maxlength="15"
                            *ngIf="!passwordVisible"
                            [error]="password != '' && passwordErrorText"
                            (keyup)="onKeyup($event, 'password')"
                        ></shared-input>
                        <img
                            class="password-icon-invisible"
                            src="assets/icons/etc/eye-invisible.svg"
                            (click)="changePasswordVisible()"
                            *ngIf="!passwordVisible"
                        />
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="confirm-password">
                        <shared-input
                            type="text"
                            [label]="'auth.reset-password.confirm-password-label' | translate"
                            [placeholder]="'auth.reset-password.confirm-password-placeholder' | translate"
                            [(ngModel)]="confirmPassword"
                            maxlength="15"
                            *ngIf="confirmPasswordVisible"
                            [error]="confirmPassword != '' && confirmPasswordErrorText"
                            (keyup)="onKeyup($event, 'confirmPassword')"
                        ></shared-input>
                        <img
                            class="password-icon-visible"
                            src="assets/icons/etc/eye-visible.svg"
                            (click)="changeConfirmPasswordVisible()"
                            *ngIf="confirmPasswordVisible"
                        />

                        <shared-input
                            type="password"
                            [label]="'auth.reset-password.confirm-password-label' | translate"
                            [placeholder]="'auth.reset-password.confirm-password-placeholder' | translate"
                            [(ngModel)]="confirmPassword"
                            maxlength="15"
                            *ngIf="!confirmPasswordVisible"
                            [error]="confirmPassword != '' && confirmPasswordErrorText"
                            (keyup)="onKeyup($event, 'confirmPassword')"
                        ></shared-input>
                        <img
                            class="password-icon-invisible"
                            src="assets/icons/etc/eye-invisible.svg"
                            (click)="changeConfirmPasswordVisible()"
                            *ngIf="!confirmPasswordVisible"
                        />
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <a
                        class="send-reset-password-link-button shared-button-primary"
                        [class.shared-button-primary-disabled]="
                            !isTokenValid || !passwordValid || !confirmPasswordValid || password != confirmPassword
                        "
                        (click)="changePassword()"
                    >
                        <div>{{ 'auth.reset-password.send-reset-password-link-button' | translate }}</div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
