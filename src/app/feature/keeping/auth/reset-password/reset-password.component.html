<div class="full-absolute user-select-none">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <img src="assets/logo/header_logo.svg" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="reset-password-form">
        <div class="container">
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-1 shared-typo-title-b24">비밀번호 재설정</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-2 shared-typo-desc-r12">새로 사용할 비밀번호를 입력해 주세요.</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="password">
                        <shared-input
                            label="새 비밀번호 입력"
                            placeholder="비밀번호를 입력해 주세요."
                            [(ngModel)]="password"
                        ></shared-input>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="confirm-password">
                        <shared-input
                            label="새 비밀번호 확인"
                            placeholder="비밀번호를 한번 더 입력해 주세요"
                            [(ngModel)]="confirmPassword"
                        ></shared-input>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="send-reset-password-link-button">
                        <div
                            class="d-sm-none"
                            shared-button
                            sharedButtonType="primary"
                            sharedButtonSize="small"
                            sharedButtonHeight="44"
                        >
                            <div>설정 완료</div>
                        </div>
                        <div
                            class="d-none d-sm-flex"
                            shared-button
                            sharedButtonType="primary"
                            sharedButtonSize="medium"
                            sharedButtonHeight="52"
                        >
                            <div>설정 완료</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
