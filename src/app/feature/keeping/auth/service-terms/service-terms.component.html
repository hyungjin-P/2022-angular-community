<div class="full-absolute">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <img src="assets/images/logo/header_logo.svg" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="agreement-form">
        <div class="container">
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <ng-container *ngTemplateOutlet="text1"></ng-container>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <ng-container *ngTemplateOutlet="text2"></ng-container>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="agreement-all">
                        <ng-container *ngTemplateOutlet="agreementAllRef"></ng-container>
                    </div>
                    <div class="h-line"></div>
                    <div class="agreement-1">
                        <ng-container *ngTemplateOutlet="agreement1"></ng-container>
                    </div>
                    <div class="agreement-2 d-flex justify-content-between">
                        <ng-container *ngTemplateOutlet="agreement2"></ng-container>
                    </div>
                    <div class="agreement-3 d-flex justify-content-between">
                        <ng-container *ngTemplateOutlet="agreement3"></ng-container>
                    </div>
                    <div class="agreement-4 d-flex justify-content-between">
                        <ng-container *ngTemplateOutlet="agreement4"></ng-container>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="agreement-button">
                        <div
                            shared-button
                            sharedButtonType="primary"
                            sharedButtonSize="medium"
                            sharedButtonHeight="52"
                            [sharedButtonDisabled]="!agreementAge || !agreementPrivacy || !agreementServiceTerms"
                            (click)="updateUser()"
                        >
                            <div>동의하고 가입하기</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #text1>
    <div class="d-sm-none shared-typo-title-b22">약관에 동의하시면<br />회원가입이 완료됩니다.</div>
    <div class="d-none d-sm-block shared-typo-title-b24">약관에 동의하시면<br />회원가입이 완료됩니다.</div>
</ng-template>

<ng-template #text2>
    <div class="d-sm-none text-2 shared-typo-desc-r12">
        키핑에서 커뮤니티 활동을 하시기 위해선, 필수약관에 동의해주셔야 합니다.
        <br />
        선택항목은 동의하지 않으셔도 서비스 이용이 가능하며, 마이페이지에서 언제든지 변경 가능합니다.
    </div>
    <div class="d-none d-sm-block text-2 shared-typo-desc-r13">
        키핑에서 커뮤니티 활동을 하시기 위해선, 필수약관에 동의해주셔야 합니다.
        <br />
        선택항목은 동의하지 않으셔도 서비스 이용이 가능하며, 마이페이지에서 언제든지 변경 가능합니다.
    </div>
</ng-template>

<ng-template #agreementAllRef>
    <shared-checkbox
        class="d-sm-none"
        text="모두 동의하기"
        [checked]="agreementAll"
        (click)="checkTerms('all')"
        size="small"
        shape="circle"
    ></shared-checkbox>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="모두 동의하기"
        [checked]="agreementAll"
        (click)="checkTerms('all')"
        shape="circle"
    ></shared-checkbox>
</ng-template>

<ng-template #agreement1>
    <shared-checkbox
        class="d-sm-none"
        text="[필수] 만 14세 이상입니다."
        [checked]="agreementAge"
        (click)="checkTerms('age')"
        size="small"
        shape="none"
    ></shared-checkbox>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="[필수] 만 14세 이상입니다."
        [checked]="agreementAge"
        (click)="checkTerms('age')"
        shape="none"
    ></shared-checkbox>
</ng-template>

<ng-template #agreement2>
    <shared-checkbox
        class="d-sm-none"
        text="[필수] 서비스 이용 약관 동의"
        [checked]="agreementPrivacy"
        (click)="checkTerms('privacy')"
        size="small"
        shape="none"
    ></shared-checkbox>
    <div class="d-sm-none shared-typo-body-m12" (click)="showPopup('service-terms')">보기</div>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="[필수] 서비스 이용 약관 동의"
        [checked]="agreementPrivacy"
        (click)="checkTerms('privacy')"
        shape="none"
    ></shared-checkbox>
    <div class="d-none d-sm-flex shared-typo-body-m13" (click)="showPopup('service-terms')">보기</div>
</ng-template>

<ng-template #agreement3>
    <shared-checkbox
        class="d-sm-none"
        text="[필수] 개인정보 수집 및 이용 동의"
        [checked]="agreementServiceTerms"
        (click)="checkTerms('serviceTerms')"
        size="small"
        shape="none"
    ></shared-checkbox>
    <div class="d-sm-none shared-typo-body-m12" (click)="showPopup('privacy')">보기</div>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="[필수] 개인정보 수집 및 이용 동의"
        [checked]="agreementServiceTerms"
        (click)="checkTerms('serviceTerms')"
        shape="none"
    ></shared-checkbox>
    <div class="d-none d-sm-flex shared-typo-body-m12" (click)="showPopup('privacy')">보기</div>
</ng-template>

<ng-template #agreement4>
    <shared-checkbox
        class="d-sm-none"
        text="[선택] 마케팅 정보 수신 동의"
        [checked]="agreementMarketing"
        (click)="checkTerms('marketing')"
        size="small"
        shape="none"
    ></shared-checkbox>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="[선택] 마케팅 정보 수신 동의"
        [checked]="agreementMarketing"
        (click)="checkTerms('marketing')"
        shape="none"
    ></shared-checkbox>
</ng-template>

<div class="popup-privacy-service-terms" #popupPrivacyServiceTermsRef (click)="hidePopup()">
    <div class="privacy-service-terms" (click)="$event.stopPropagation()">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="privacy-service-terms-header">
                        <ng-container *ngTemplateOutlet="privacyServiceTermsHeaderTitle"></ng-container>
                        <div class="privacy-service-terms-close-icon" (click)="hidePopup()">
                            <span class="mdi mdi-close"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="privacy-service-terms-nav">
            <div
                class="privacy-service-terms-menu shared-typo-body-m14"
                [class.privacy-service-terms-selected]="selectedMenu == 'service-terms'"
                (click)="changeMenu('service-terms')"
            >
                서비스 이용약관
            </div>
            <div class="privacy-service-terms-v-line"></div>
            <div
                class="privacy-service-terms-menu shared-typo-body-m14"
                [class.privacy-service-terms-selected]="selectedMenu == 'privacy'"
                (click)="changeMenu('privacy')"
            >
                개인정보 처리방침
            </div>
        </div>
        <div class="privacy-service-terms-content scroll-y">
            <div *ngIf="selectedMenu == 'service-terms'">
                <div class="container">
                    <div class="row">
                        <div class="col">
                            <service-terms-component></service-terms-component>
                        </div>
                    </div>
                </div>
            </div>
            <div *ngIf="selectedMenu == 'privacy'">
                <div class="container">
                    <div class="row">
                        <div class="col">
                            <privacy-component></privacy-component>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="privacy-service-terms-confirm">
            <div
                shared-button
                sharedButtonType="primary"
                sharedButtonSize="medium"
                sharedButtonHeight="52"
                (click)="hidePopup()"
            >
                <div>확인</div>
            </div>
        </div>
    </div>
</div>

<ng-template #privacyServiceTermsHeaderTitle>
    <div class="d-sm-none shared-typo-title-b16">약관동의</div>
    <div class="d-none d-sm-block shared-typo-title-b20">약관동의</div>
</ng-template>
