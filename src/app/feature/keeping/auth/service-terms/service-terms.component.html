<div class="full-absolute">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <img src="assets/images/logo/header_logo.svg" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="agreement-form">
        <div class="container">
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-1">약관에 동의하시면<br />회원가입이 완료됩니다.</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-2">
                        키핑에서 커뮤니티 활동을 하시기 위해선, 필수약관에 동의해주셔야 합니다.
                        <br />
                        선택항목은 동의하지 않으셔도 서비스 이용이 가능하며, 마이페이지에서 언제든지 변경 가능합니다.
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="agreement-all">
                        <shared-checkbox
                            text="모두 동의하기"
                            [checked]="agreementAll"
                            shape="circle"
                            (click)="checkTerms('all')"
                        ></shared-checkbox>
                    </div>
                    <div class="h-line"></div>
                    <div class="agreement-1">
                        <shared-checkbox
                            text="[필수] 만 14세 이상입니다."
                            [checked]="agreementAge"
                            shape="none"
                            (click)="checkTerms('age')"
                        ></shared-checkbox>
                    </div>
                    <div class="agreement-2 d-flex justify-content-between">
                        <shared-checkbox
                            text="[필수] 서비스 이용 약관 동의"
                            [checked]="agreementPrivacy"
                            shape="none"
                            (click)="checkTerms('privacy')"
                        ></shared-checkbox>
                        <div (click)="showPopup('service-terms')">보기</div>
                    </div>
                    <div class="agreement-3 d-flex justify-content-between">
                        <shared-checkbox
                            text="[필수] 개인정보 수집 및 이용 동의"
                            [checked]="agreementServiceTerms"
                            shape="none"
                            (click)="checkTerms('serviceTerms')"
                        ></shared-checkbox>
                        <div (click)="showPopup('privacy')">보기</div>
                    </div>
                    <div class="agreement-4 d-flex justify-content-between">
                        <shared-checkbox
                            text="[선택] 마케팅 정보 수신 동의"
                            [checked]="agreementMarketing"
                            shape="none"
                            (click)="checkTerms('marketing')"
                        ></shared-checkbox>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div
                        class="agreement-button shared-button-primary"
                        [class.shared-button-primary-disabled]="
                            !agreementAge || !agreementPrivacy || !agreementServiceTerms
                        "
                        (click)="updateUser()"
                    >
                        <div>동의하고 가입하기</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="popup-privacy-service-terms" #popupPrivacyServiceTermsRef (click)="hidePopup()">
    <div class="privacy-service-terms" (click)="$event.stopPropagation()">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="privacy-service-terms-header">
                        <div>약관동의</div>
                        <div class="privacy-service-terms-close-icon" (click)="hidePopup()">
                            <span class="mdi mdi-close"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="privacy-service-terms-nav">
            <div
                class="privacy-service-terms-menu"
                [class.privacy-service-terms-selected]="selectedMenu == 'service-terms'"
                (click)="changeMenu('service-terms')"
            >
                서비스 이용약관
            </div>
            <div class="privacy-service-terms-v-line"></div>
            <div
                class="privacy-service-terms-menu"
                [class.privacy-service-terms-selected]="selectedMenu == 'privacy'"
                (click)="changeMenu('privacy')"
            >
                개인정보 처리방침
            </div>
        </div>
        <div class="privacy-service-terms-content scroll-y">
            <div *ngIf="selectedMenu == 'service-terms'">
                <div class="container">
                    <div class="row">
                        <div class="col">
                            <service-terms-component></service-terms-component>
                        </div>
                    </div>
                </div>
            </div>
            <div *ngIf="selectedMenu == 'privacy'">
                <div class="container">
                    <div class="row">
                        <div class="col">
                            <privacy-component></privacy-component>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="privacy-service-terms-confirm shared-button-primary" (click)="hidePopup()">
            <div>확인</div>
        </div>
    </div>
</div>
