<div class="full-absolute">
    <div class="mobile d-lg-none">
        <div class="header">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="leading">
                            <div class="logo" [routerLink]="['/']">
                                <img src="assets/images/logo/header_logo.svg" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="login-form">
            <ng-container *ngTemplateOutlet="loginForm"></ng-container>
        </div>
    </div>

    <div class="desktop d-none d-lg-flex">
        <div class="left-side">
            <div class="login-image">
                <img src="assets/images/auth/login-image.png" />
            </div>
        </div>
        <div class="right-side d-flex justify-content-center align-items-center">
            <div class="login-form">
                <ng-container *ngTemplateOutlet="loginForm"></ng-container>
            </div>
        </div>
    </div>
</div>

<ng-template #loginForm>
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="text-1">
                    <span>{{ 'auth.login.text1' | translate }}</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="text-2">
                    <span>아직 키핑 회원이 아니세요?</span>
                    <span [routerLink]="['/auth/registration']">회원가입</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="lang" [class.lang-box-open]="langBoxVisible" (click)="openLangBox($event)">
                    <span>{{ 'auth.login.text2' | translate }}</span>
                    <span class="mdi mdi-chevron-down"></span>
                    <div
                        class="lang-box"
                        [class.d-block]="langBoxVisible"
                        (click)="$event.stopPropagation()"
                        (sharedClickOutside)="closeLangBox()"
                    >
                        <div class="lang-box-menu" (click)="switchLanguage('ko')">
                            <div>한국어</div>
                            <shared-checkbox [checked]="selectedLanguage == 'ko'" shape="circle"></shared-checkbox>
                        </div>
                        <div class="lang-box-h-line"></div>
                        <div class="lang-box-menu" (click)="switchLanguage('en')">
                            <div>English</div>
                            <shared-checkbox [checked]="selectedLanguage == 'en'" shape="circle"></shared-checkbox>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="email">
                    <shared-input
                        [label]="'auth.login.email' | translate"
                        placeholder="이메일 주소를 입력해 주세요"
                        [(ngModel)]="email"
                        maxlength="50"
                        [error]="email != '' && emailErrorText"
                        (keyup)="onKeyup($event, 'email')"
                    ></shared-input>
                    <div class="mdi mdi-check" *ngIf="emailValid"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="password">
                    <shared-input
                        type="text"
                        label="비밀번호"
                        placeholder="비밀번호를 입력해 주세요"
                        [(ngModel)]="password"
                        maxlength="15"
                        *ngIf="passwordVisible"
                        [error]="password != '' && passwordErrorText"
                        (keyup)="onKeyup($event, 'password')"
                    ></shared-input>
                    <img
                        class="password-icon-visible"
                        src="assets/icons/etc/eye-visible.svg"
                        (click)="changePasswordVisible()"
                        *ngIf="passwordVisible"
                    />

                    <shared-input
                        type="password"
                        label="비밀번호"
                        placeholder="비밀번호를 입력해 주세요"
                        [(ngModel)]="password"
                        maxlength="15"
                        *ngIf="!passwordVisible"
                        [error]="password != '' && passwordErrorText"
                        (keyup)="onKeyup($event, 'password')"
                    ></shared-input>
                    <img
                        class="password-icon-invisible"
                        src="assets/icons/etc/eye-invisible.svg"
                        (click)="changePasswordVisible()"
                        *ngIf="!passwordVisible"
                    />
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="text-3">
                    <span [routerLink]="['/auth/forgot-password']">비밀번호를 잊으셨나요?</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div
                    class="email-login-button shared-button-primary"
                    [class.shared-button-primary-disabled]="!emailValid || !passwordValid"
                    (click)="signInWithEmail()"
                >
                    <div>로그인</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="text-4">
                    <span>SNS 계정으로 3초만에 시작하기</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="social-button-group">
                    <div class="social-button kakao-login-button" (click)="signInWithKakao()">
                        <img src="assets/icons/social/kakao.png" />
                    </div>
                    <div class="social-button naver-login-button" (click)="signInWithNaver()">
                        <img src="assets/icons/social/naver.png" />
                    </div>
                    <div class="social-button google-login-button" (click)="signInWithGoogle()">
                        <img src="assets/icons/social/google.png" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</ng-template>
