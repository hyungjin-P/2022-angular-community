<div class="full-absolute">
    <div class="mobile d-lg-none">
        <div class="header">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="leading">
                            <img src="assets/images/logo/header_logo.svg" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="login-form">
            <ng-container *ngTemplateOutlet="loginForm"></ng-container>
        </div>
    </div>

    <div class="desktop d-none d-lg-flex">
        <div class="left-side">
            <div class="login-image">
                <img src="assets/images/auth/login-image.png" />
            </div>
        </div>
        <div class="right-side d-flex justify-content-center align-items-center">
            <div class="login-form">
                <ng-container *ngTemplateOutlet="loginForm"></ng-container>
            </div>
        </div>
    </div>
</div>

<ng-template #loginForm>
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="text-1 shared-typo-title-b26">
                    <span>로그인</span>
                </div>
            </div>
        </div>
        <div class="row d-lg-none">
            <div class="col">
                <ng-container *ngTemplateOutlet="loginFormText2"></ng-container>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="email">
                    <shared-input
                        label="이메일"
                        placeholder="이메일 주소를 입력해 주세요"
                        [(ngModel)]="email"
                        maxlength="50"
                        [error]="email != '' && emailErrorText"
                        (keyup)="onKeyup($event, 'email')"
                    ></shared-input>
                    <div class="mdi mdi-check" *ngIf="emailValid"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="password">
                    <shared-input
                        type="text"
                        label="비밀번호"
                        placeholder="비밀번호를 입력해 주세요"
                        [(ngModel)]="password"
                        maxlength="15"
                        *ngIf="passwordVisible"
                        [error]="password != '' && passwordErrorText"
                        (keyup)="onKeyup($event, 'password')"
                    ></shared-input>
                    <img
                        class="password-icon-visible"
                        src="assets/icons/etc/eye-visible.svg"
                        (click)="changePasswordVisible()"
                        *ngIf="passwordVisible"
                    />

                    <shared-input
                        type="password"
                        label="비밀번호"
                        placeholder="비밀번호를 입력해 주세요"
                        [(ngModel)]="password"
                        maxlength="15"
                        *ngIf="!passwordVisible"
                        [error]="password != '' && passwordErrorText"
                        (keyup)="onKeyup($event, 'password')"
                    ></shared-input>
                    <img
                        class="password-icon-invisible"
                        src="assets/icons/etc/eye-invisible.svg"
                        (click)="changePasswordVisible()"
                        *ngIf="!passwordVisible"
                    />
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="text-3 shared-typo-body-m12">
                    <span [routerLink]="['/auth/forgot-password']">비밀번호를 잊으셨나요?</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="email-login-button">
                    <div
                        shared-button
                        sharedButtonType="primary"
                        sharedButtonSize="medium"
                        sharedButtonHeight="52"
                        [sharedButtonDisabled]="!emailValid || !passwordValid"
                        (click)="signInWithEmail()"
                    >
                        <div>로그인</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="kakao-login-button" (click)="signInWithKakao()">
                    <img src="assets/icons/social/kakao.svg" />
                    <div>카카오로 3초만에 시작하기</div>
                </div>
            </div>
        </div>

            </div>
        </div>
        <div class="row">

        <div class="row d-none d-lg-flex">
            <div class="col">
                <ng-container *ngTemplateOutlet="loginFormText2"></ng-container>
            </div>
        </div>
    </div>
</ng-template>

<ng-template #loginFormText2>
    <div class="text-2">
        <span class="shared-typo-desc-m13">아직 키핑 회원이 아니세요?</span>
        <span class="shared-typo-body-m13" [routerLink]="['/auth/registration']">회원가입</span>
