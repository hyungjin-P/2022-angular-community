<div class="full-absolute user-select-none">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <img src="assets/logo/header_logo.svg" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="login-image">
        <img src="assets/images/login-image.png" />
    </div>
    <div class="login-form b-1">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="text-1 shared-typo-title-b26">
                        <span>로그인</span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="text-2">
                        <span class="shared-typo-desc-m13">아직 키핑 회원이 아니세요?</span>
                        <span class="shared-typo-body-m13">회원가입</span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="email">
                        <shared-input
                            label="이메일"
                            placeholder="이메일 주소를 입력해 주세요"
                            [(ngModel)]="email"
                        ></shared-input>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="password">
                        <shared-input
                            label="비밀번호"
                            placeholder="이메일 주소를 입력해 주세요"
                            [(ngModel)]="email"
                        ></shared-input>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="text-3 shared-typo-body-m13">
                        <span>비밀번호를 잊으셨나요?</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
