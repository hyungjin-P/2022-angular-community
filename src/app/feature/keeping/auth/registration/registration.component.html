<div class="full-absolute">
    <div class="mobile d-lg-none">
        <div class="header">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="leading">
                            <div class="logo" [routerLink]="['/']">
                                <img src="assets/images/logo/header_logo.svg" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="registration-form">
            <ng-container *ngTemplateOutlet="registrationForm"></ng-container>
        </div>
    </div>

    <div class="desktop d-none d-lg-flex">
        <div class="left-side">
            <div class="registration-image">
                <img
                    src="https://public.keeping.link/assets/images/auth/registration.jpg?w=768&q=10"
                    #img
                    (load)="onImageLoad(img)"
                />
            </div>
        </div>
        <div class="right-side d-flex justify-content-center align-items-center">
            <div class="registration-form">
                <ng-container *ngTemplateOutlet="registrationForm"></ng-container>
            </div>
        </div>
    </div>
</div>

<ng-template #registrationForm>
    <div class="container">
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="text-1">
                    <div>{{ 'auth.registration.text1-1' | translate }}</div>
                    <div>{{ 'auth.registration.text1-2' | translate }}</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="text-2">
                    <span>{{ 'auth.registration.text2' | translate }}</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="social-button-group">
                    <div class="social-button kakao-login-button" (click)="signInWithKakao()">
                        <img src="assets/icons/social/kakao.png" />
                    </div>
                    <div class="social-button naver-login-button" (click)="signInWithNaver()">
                        <img src="assets/icons/social/naver.png" />
                    </div>
                    <div class="social-button google-login-button" (click)="signInWithGoogle()">
                        <img src="assets/icons/social/google.png" />
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="email" [routerLink]="['/auth/email']">
                    <div class="mdi mdi-email"></div>
                    <div>{{ 'auth.registration.email-signup-button' | translate }}</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="text-3">
                    <span>{{ 'auth.registration.text3-1' | translate }}</span>
                    <span [routerLink]="['/auth/login']">{{ 'auth.registration.text3-2' | translate }}</span>
                </div>
            </div>
        </div>
    </div>
</ng-template>
