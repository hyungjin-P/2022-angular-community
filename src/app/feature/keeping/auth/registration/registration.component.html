<div class="full-absolute">
    <div class="mobile d-lg-none">
        <div class="header">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="leading">
                            <img src="assets/images/logo/header_logo.svg" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="registration-form">
            <ng-container *ngTemplateOutlet="registrationForm"></ng-container>
        </div>
    </div>

    <div class="desktop d-none d-lg-flex">
        <div class="left-side">
            <div class="registration-image">
                <img src="assets/images/auth/registration-image.png" />
            </div>
        </div>
        <div class="right-side d-flex justify-content-center align-items-center">
            <div class="registration-form">
                <ng-container *ngTemplateOutlet="registrationForm"></ng-container>
            </div>
        </div>
    </div>
</div>

<ng-template #registrationForm>
    <div class="container">
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="text-1 shared-typo-title-b26">
                    <span>키핑 서비스 가입하기</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="email" #emailRef>
                    <shared-input
                        label="이메일"
                        placeholder="이메일 주소를 입력해 주세요"
                        maxlength="50"
                        [(ngModel)]="email"
                        [error]="email != '' && emailErrorText"
                        [disabled]="emailVerified"
                    ></shared-input>
                    <div
                        class="shared-typo-body-m12 send-verification-code"
                        [class.send-verification-code-enable]="emailValid"
                        *ngIf="!emailVerified && !verificationCodeVisible"
                        (click)="sendVerificationCodeMail()"
                    >
                        인증하기
                    </div>
                    <div
                        class="shared-typo-body-m12 resend-verification-code"
                        *ngIf="verificationCodeVisible"
                        (click)="sendVerificationCodeMail()"
                    >
                        재전송
                    </div>
                    <div class="mdi mdi-check" *ngIf="emailVerified"></div>
                </div>
            </div>
        </div>
        <div class="row" [class.d-none]="!verificationCodeVisible">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="verification-code">
                    <shared-input
                        label="인증번호"
                        placeholder="인증번호를 입력해 주세요."
                        [(ngModel)]="verificationCode"
                        maxlength="6"
                        info="메일에 발송된 인증번호 6자리를 입력해 주세요."
                        [error]="verificationCodeErrorText"
                        (keypress)="checkDigit($event)"
                        (keyup)="onKeyup($event, 'verificationCode')"
                    ></shared-input>
                    <div class="shared-typo-body-m11 time" *ngIf="timeLeft > 0">{{ timeLeft | minuteSeconds }}</div>
                    <div
                        class="shared-typo-body-m12 confirm-verification-code"
                        [class.confirm-verification-code-enable]="verificationCode.length == 6 && timeLeft > 0"
                        (click)="checkVerificationCodeMail()"
                    >
                        인증확인
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="password">
                    <shared-input
                        type="text"
                        label="비밀번호"
                        placeholder="비밀번호를 입력해 주세요"
                        [(ngModel)]="password"
                        maxlength="15"
                        *ngIf="passwordVisible"
                        [error]="password != '' && passwordErrorText"
                        (keyup)="onKeyup($event, 'password')"
                    ></shared-input>
                    <img
                        class="password-icon-visible"
                        src="assets/icons/etc/eye-visible.svg"
                        (click)="changePasswordVisible()"
                        *ngIf="passwordVisible"
                    />

                    <shared-input
                        type="password"
                        label="비밀번호"
                        placeholder="비밀번호를 입력해 주세요"
                        [(ngModel)]="password"
                        maxlength="15"
                        *ngIf="!passwordVisible"
                        [error]="password != '' && passwordErrorText"
                        (keyup)="onKeyup($event, 'password')"
                    ></shared-input>
                    <img
                        class="password-icon-invisible"
                        src="assets/icons/etc/eye-invisible.svg"
                        (click)="changePasswordVisible()"
                        *ngIf="!passwordVisible"
                    />
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="password">
                    <shared-input
                        type="text"
                        label="비밀번호 확인"
                        placeholder="비밀번호를 입력해 주세요"
                        [(ngModel)]="confirmPassword"
                        maxlength="15"
                        *ngIf="confirmPasswordVisible"
                        [error]="confirmPassword != '' && confirmPasswordErrorText"
                        (keyup)="onKeyup($event, 'confirmPassword')"
                    ></shared-input>
                    <img
                        class="password-icon-visible"
                        src="assets/icons/etc/eye-visible.svg"
                        (click)="changeConfirmPasswordVisible()"
                        *ngIf="confirmPasswordVisible"
                    />

                    <shared-input
                        type="password"
                        label="비밀번호 확인"
                        placeholder="비밀번호를 입력해 주세요"
                        [(ngModel)]="confirmPassword"
                        maxlength="15"
                        *ngIf="!confirmPasswordVisible"
                        [error]="confirmPassword != '' && confirmPasswordErrorText"
                        (keyup)="onKeyup($event, 'confirmPassword')"
                    ></shared-input>
                    <img
                        class="password-icon-invisible"
                        src="assets/icons/etc/eye-invisible.svg"
                        (click)="changeConfirmPasswordVisible()"
                        *ngIf="!confirmPasswordVisible"
                    />
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="agreement d-flex justify-content-between">
                    <div>
                        <shared-checkbox
                            text="키핑 가입 약관에 모두 동의합니다"
                            [checked]="agreementAll"
                            (click)="checkTerms('all')"
                            size="small"
                            shape="circle"
                        ></shared-checkbox>
                    </div>
                    <div class="shared-typo-body-m12" (click)="showPopup('popup-privacy-service-terms')">확인하기</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="text-2 shared-typo-body-r11">
                    <div>(필수)키핑 이용약관, 개인정보 처리방침, (선택)마케팅 정보 수신동의</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="registration-button">
                    <div
                        shared-button
                        sharedButtonType="primary"
                        sharedButtonSize="medium"
                        sharedButtonHeight="52"
                        [sharedButtonDisabled]="
                            !emailVerified ||
                            !passwordValid ||
                            !confirmPasswordValid ||
                            password != confirmPassword ||
                            !agreementAge ||
                            !agreementPrivacy ||
                            !agreementServiceTerms
                        "
                    >
                        <div>가입하기</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ng-template>

<div
    class="popup-privacy-service-terms"
    #popupPrivacyServiceTermsRef
    (click)="hidePopup('popup-privacy-service-terms')"
>
    <div class="privacy-service-terms" (click)="$event.stopPropagation()">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="shared-typo-title-b20">약관 확인하기</div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <ng-container *ngTemplateOutlet="privacyServiceTermsDesc"></ng-container>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="privacy-service-terms-agreement-all">
                        <ng-container *ngTemplateOutlet="privacyServiceTermsAgreementAll"></ng-container>
                    </div>
                    <div class="privacy-service-terms-agreement-1">
                        <ng-container *ngTemplateOutlet="privacyServiceTermsAgreement1"></ng-container>
                    </div>
                    <div class="privacy-service-terms-agreement-2 d-flex justify-content-between">
                        <ng-container *ngTemplateOutlet="privacyServiceTermsAgreement2"></ng-container>
                    </div>
                    <div
                        class="privacy-service-terms-agreement-2-content scroll-y"
                        [class.privacy-service-terms-agreement-2-content-show]="isPrivacyOpen"
                    >
                        <div class="container">
                            <div class="row">
                                <div class="col">
                                    <service-terms-fragment></service-terms-fragment>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="privacy-service-terms-agreement-3 d-flex justify-content-between">
                        <ng-container *ngTemplateOutlet="privacyServiceTermsAgreement3"></ng-container>
                    </div>
                    <div
                        class="privacy-service-terms-agreement-3-content scroll-y"
                        [class.privacy-service-terms-agreement-3-content-show]="isServiceTermsOpen"
                    >
                        <div class="container">
                            <div class="row">
                                <div class="col">
                                    <privacy-fragment></privacy-fragment>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="privacy-service-terms-agreement-4 d-flex justify-content-between">
                        <ng-container *ngTemplateOutlet="privacyServiceTermsAgreement4"></ng-container>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <ng-container *ngTemplateOutlet="privacyServiceTermsConfirm"></ng-container>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #privacyServiceTermsDesc>
    <div class="privacy-service-terms-desc shared-typo-body-r12 d-sm-none">키핑은 개인정보를 안전하게 취급합니다.</div>
    <div class="privacy-service-terms-desc shared-typo-body-r14 d-none d-sm-block">
        키핑은 개인정보를 안전하게 취급합니다.
    </div>
</ng-template>

<ng-template #privacyServiceTermsAgreementAll>
    <shared-checkbox
        class="d-sm-none"
        text="모두 동의하기"
        [checked]="agreementAll"
        (click)="checkTerms('all')"
        size="small"
        shape="circle"
    ></shared-checkbox>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="모두 동의하기"
        [checked]="agreementAll"
        (click)="checkTerms('all')"
        shape="circle"
    ></shared-checkbox>
</ng-template>

<ng-template #privacyServiceTermsAgreement1>
    <shared-checkbox
        class="d-sm-none"
        text="[필수] 만 14세 이상입니다."
        [checked]="agreementAge"
        (click)="checkTerms('age')"
        size="small"
        shape="none"
    ></shared-checkbox>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="[필수] 만 14세 이상입니다."
        [checked]="agreementAge"
        (click)="checkTerms('age')"
        shape="none"
    ></shared-checkbox>
</ng-template>

<ng-template #privacyServiceTermsAgreement2>
    <shared-checkbox
        class="d-sm-none"
        text="[필수] 서비스 이용 약관 동의"
        [checked]="agreementPrivacy"
        (click)="checkTerms('privacy')"
        size="small"
        shape="none"
    ></shared-checkbox>
    <div class="d-sm-none shared-typo-body-m11" (click)="openContent('privacy')">펼치기</div>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="[필수] 서비스 이용 약관 동의"
        [checked]="agreementPrivacy"
        (click)="checkTerms('privacy')"
        shape="none"
    ></shared-checkbox>
    <div class="d-none d-sm-flex shared-typo-body-m12" (click)="openContent('privacy')">펼치기</div>
</ng-template>

<ng-template #privacyServiceTermsAgreement3>
    <shared-checkbox
        class="d-sm-none"
        text="[필수] 개인정보 수집 및 이용 동의"
        [checked]="agreementServiceTerms"
        (click)="checkTerms('serviceTerms')"
        size="small"
        shape="none"
    ></shared-checkbox>
    <div class="d-sm-none shared-typo-body-m11" (click)="openContent('service-terms')">펼치기</div>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="[필수] 개인정보 수집 및 이용 동의"
        [checked]="agreementServiceTerms"
        (click)="checkTerms('serviceTerms')"
        shape="none"
    ></shared-checkbox>
    <div class="d-none d-sm-flex shared-typo-body-m12" (click)="openContent('service-terms')">펼치기</div>
</ng-template>

<ng-template #privacyServiceTermsAgreement4>
    <shared-checkbox
        class="d-sm-none"
        text="[선택] 마케팅 정보 수신 동의"
        [checked]="agreementMarketing"
        (click)="checkTerms('marketing')"
        size="small"
        shape="none"
    ></shared-checkbox>
    <shared-checkbox
        class="d-none d-sm-flex"
        text="[선택] 마케팅 정보 수신 동의"
        [checked]="agreementMarketing"
        (click)="checkTerms('marketing')"
        shape="none"
    ></shared-checkbox>
</ng-template>

<ng-template #privacyServiceTermsConfirm>
    <div class="privacy-service-terms-confirm d-sm-none">
        <div
            shared-button
            sharedButtonType="primary"
            sharedButtonSize="small"
            sharedButtonHeight="44"
            (click)="hidePopup('popup-privacy-service-terms')"
        >
            <div>확인</div>
        </div>
    </div>
    <div class="privacy-service-terms-confirm d-none d-sm-block">
        <div
            shared-button
            sharedButtonType="primary"
            sharedButtonSize="medium"
            sharedButtonHeight="52"
            (click)="hidePopup('popup-privacy-service-terms')"
        >
            <div>확인</div>
        </div>
    </div>
</ng-template>
