<div class="full-absolute">
    <div class="mobile d-lg-none">
        <div class="header">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="leading">
                            <img src="assets/images/logo/header_logo.svg" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="registration-form">
            <ng-container *ngTemplateOutlet="registrationForm"></ng-container>
        </div>
    </div>

    <div class="desktop d-none d-lg-flex">
        <div class="left-side">
            <div class="registration-image">
                <img src="assets/images/auth/registration-image.png" />
            </div>
        </div>
        <div class="right-side d-flex justify-content-center align-items-center">
            <div class="registration-form">
                <ng-container *ngTemplateOutlet="registrationForm"></ng-container>
            </div>
        </div>
    </div>
</div>

<ng-template #registrationForm>
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="text-1 shared-typo-title-b26">
                    <span>키핑 서비스 가입하기</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="email">
                    <shared-input
                        label="이메일"
                        placeholder="이메일 주소를 입력해 주세요"
                        [(ngModel)]="email"
                    ></shared-input>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="password">
                    <shared-input
                        label="비밀번호"
                        placeholder="비밀번호를 입력해 주세요."
                        [(ngModel)]="password"
                    ></shared-input>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="password">
                    <shared-input
                        label="비밀번호 확인"
                        placeholder="비밀번호를 한번 더 입력해 주세요"
                        [(ngModel)]="confirmPassword"
                    ></shared-input>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="agreement d-flex justify-content-between">
                    <div>
                        <shared-checkbox
                            text="키핑 가입 약관에 모두 동의합니다"
                            [checked]="checkbox"
                            (click)="clickCheckbox()"
                            size="small"
                            shape="circle"
                        ></shared-checkbox>
                    </div>
                    <div class="shared-typo-body-m12" (click)="showPopup('popup-privacy-service-terms')">확인하기</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="text-2 shared-typo-body-r11">
                    <div>(필수)키핑 이용약관, 개인정보 처리방침, (선택)마케팅 정보 수신동의</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col col-sm-8 offset-sm-2 col-lg-12 offset-lg-0">
                <div class="registration-button">
                    <div shared-button sharedButtonType="primary" sharedButtonSize="medium" sharedButtonHeight="52">
                        <div>가입하기</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ng-template>

<div
    class="popup-privacy-service-terms"
    #popupPrivacyServiceTermsRef
    (click)="hidePopup('popup-privacy-service-terms')"
>
    <div class="privacy-service-terms" (click)="$event.stopPropagation()">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="shared-typo-title-b20">약관 확인하기</div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="privacy-service-terms-desc shared-typo-body-r12">
                        키핑은 개인정보를 안전하게 취급합니다.
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="agreement-all">
                        <shared-checkbox
                            text="모두 동의하기"
                            [checked]="checkbox"
                            (click)="clickCheckbox()"
                            size="small"
                            shape="circle"
                        ></shared-checkbox>
                    </div>
                    <div class="agreement-1">
                        <shared-checkbox
                            text="[필수] 만 14세 이상입니다."
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            size="small"
                            shape="none"
                        ></shared-checkbox>
                    </div>
                    <div class="agreement-2 d-flex justify-content-between">
                        <shared-checkbox
                            text="[필수] 서비스 이용 약관 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            size="small"
                            shape="none"
                        ></shared-checkbox>
                        <div class="shared-typo-body-r11" (click)="openContent('privacy')">펼치기</div>
                    </div>
                    <div class="agreement-2-content scroll-y" [class.agreement-2-content-show]="isPrivacyOpen">
                        <div class="container">
                            <div class="row">
                                <div class="col">
                                    <service-terms-snippet></service-terms-snippet>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="agreement-3 d-flex justify-content-between">
                        <shared-checkbox
                            text="[필수] 개인정보 수집 및 이용 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            size="small"
                            shape="none"
                        ></shared-checkbox>
                        <div class="shared-typo-body-r11" (click)="openContent('service-terms')">펼치기</div>
                    </div>
                    <div class="agreement-3-content scroll-y" [class.agreement-3-content-show]="isServiceTermsOpen">
                        <div class="container">
                            <div class="row">
                                <div class="col">
                                    <privacy-snippet></privacy-snippet>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="agreement-4 d-flex justify-content-between">
                        <shared-checkbox
                            text="[선택] 마케팅 정보 수신 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            size="small"
                            shape="none"
                        ></shared-checkbox>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="privacy-service-terms-confirm">
                        <div
                            shared-button
                            sharedButtonType="primary"
                            sharedButtonSize="small"
                            sharedButtonHeight="44"
                            (click)="hidePopup('popup-privacy-service-terms')"
                        >
                            <div>확인</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
