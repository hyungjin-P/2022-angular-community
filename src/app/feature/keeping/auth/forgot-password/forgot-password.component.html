<div class="full-absolute user-select-none">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <a class="logo" [routerLink]="['/']">
                            <img src="assets/images/logo/mobile_header_logo.svg" />
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="forgot-password-form">
        <div class="container">
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-1">{{ 'auth.forgot-password.text1' | translate }}</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-2">{{ 'auth.forgot-password.text2' | translate }}</div>
                    <div class="text-3">{{ 'auth.forgot-password.text3' | translate }}</div>
                    <div class="text-4">{{ 'auth.forgot-password.text4' | translate }}</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="email">
                        <shared-input
                            [label]="'auth.forgot-password.email-label' | translate"
                            [placeholder]="'auth.forgot-password.email-placeholder' | translate"
                            [(ngModel)]="email"
                            maxlength="50"
                            [error]="email != '' && emailErrorText"
                            (keyup)="onKeyup($event, 'email')"
                        ></shared-input>
                        <div class="mdi mdi-check" *ngIf="emailValid"></div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <a
                        class="send-reset-password-link-button shared-button-primary"
                        [class.shared-button-primary-disabled]="!emailValid"
                        (click)="sendResetPasswordLinkMail()"
                    >
                        <div>{{ 'auth.forgot-password.send-reset-password-link-button' | translate }}</div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
