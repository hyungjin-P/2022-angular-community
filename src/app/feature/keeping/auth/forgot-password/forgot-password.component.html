<div class="full-absolute user-select-none">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <img src="assets/images/logo/header_logo.svg" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="forgot-password-form">
        <div class="container">
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-1">비밀번호 찾기</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-2">가입 시 등록한 이메일 주소를 입력해 주세요.</div>
                    <div class="text-3">새로운 비밀번호를 설정할수 있는 링크를 보내드리겠습니다.</div>
                    <div class="text-4">발송된 이메일의 비밀번호 재설정은 3분간 유효합니다.</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="email">
                        <shared-input
                            label="이메일"
                            placeholder="이메일 주소를 입력해 주세요"
                            [(ngModel)]="email"
                            maxlength="50"
                            [error]="email != '' && emailErrorText"
                            (keyup)="onKeyup($event, 'email')"
                        ></shared-input>
                        <div class="mdi mdi-check" *ngIf="emailValid"></div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <!-- <div class="send-reset-password-link-button">
                        <div
                            shared-button
                            sharedButtonType="primary"
                            sharedButtonSize="medium"
                            sharedButtonHeight="52"
                            [sharedButtonDisabled]="!emailValid"
                            (click)="sendResetPasswordLinkMail()"
                        >
                            <div>재설정 링크 발송</div>
                        </div>
                    </div> -->
                </div>
            </div>
        </div>
    </div>
</div>
