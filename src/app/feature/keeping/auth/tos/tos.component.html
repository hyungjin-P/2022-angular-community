<div class="full-absolute user-select-none">
    <div class="header">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="leading">
                        <img src="assets/logo/header_logo.svg" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="agreement-form">
        <div class="container">
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-1 shared-typo-title-b22">약관에 동의하시면<br />회원가입이 완료됩니다.</div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="text-2 shared-typo-desc-r12">
                        키핑에서 커뮤니티 활동을 하시기 위해선, 필수약관에 동의해주셔야 합니다.
                    </div>
                    <div class="text-3 shared-typo-desc-r12">
                        선택항목은 동의하지 않으셔도 서비스 이용이 가능하며, 마이페이지에서 언제든지 변경 가능합니다.
                    </div>
                </div>
            </div>
            <div class="row d-sm-none">
                <div class="col col-sm-8 offset-sm-2">
                    <div class="agreement-all">
                        <shared-checkbox
                            text="모두 동의하기"
                            [checked]="checkbox"
                            (click)="clickCheckbox()"
                            size="small"
                            shape="circle"
                        ></shared-checkbox>
                    </div>
                    <div class="h-line"></div>
                    <div class="agreement-1">
                        <shared-checkbox
                            text="[필수] 만 14세 이상입니다."
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            size="small"
                            shape="none"
                        ></shared-checkbox>
                    </div>
                    <div class="agreement-2 d-flex justify-content-between">
                        <shared-checkbox
                            text="[필수] 서비스 이용 약관 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            size="small"
                            shape="none"
                        ></shared-checkbox>
                        <div class="shared-typo-body-m12">보기</div>
                    </div>
                    <div class="agreement-3 d-flex justify-content-between">
                        <shared-checkbox
                            text="[필수] 개인정보 수집 및 이용 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            size="small"
                            shape="none"
                        ></shared-checkbox>
                        <div class="shared-typo-body-m12">보기</div>
                    </div>
                    <div class="agreement-4 d-flex justify-content-between">
                        <shared-checkbox
                            text="[선택] 마케팅 정보 수신 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            size="small"
                            shape="none"
                        ></shared-checkbox>
                        <div class="shared-typo-body-m12">보기</div>
                    </div>
                </div>
            </div>
            <div class="row d-none d-sm-flex">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="agreement-all">
                        <shared-checkbox
                            text="모두 동의하기"
                            [checked]="checkbox"
                            (click)="clickCheckbox()"
                            shape="circle"
                        ></shared-checkbox>
                    </div>
                    <div class="h-line"></div>
                    <div class="agreement-1">
                        <shared-checkbox
                            text="[필수] 만 14세 이상입니다."
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            shape="none"
                        ></shared-checkbox>
                    </div>
                    <div class="agreement-2 d-flex justify-content-between">
                        <shared-checkbox
                            text="[필수] 서비스 이용 약관 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            shape="none"
                        ></shared-checkbox>
                        <div class="shared-typo-body-m13">보기</div>
                    </div>
                    <div class="agreement-3 d-flex justify-content-between">
                        <shared-checkbox
                            text="[필수] 개인정보 수집 및 이용 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            shape="none"
                        ></shared-checkbox>
                        <div class="shared-typo-body-m13">보기</div>
                    </div>
                    <div class="agreement-4 d-flex justify-content-between">
                        <shared-checkbox
                            text="[선택] 마케팅 정보 수신 동의"
                            [checked]="checkbox1"
                            (click)="clickCheckbox1()"
                            shape="none"
                        ></shared-checkbox>
                        <div class="shared-typo-body-m13">보기</div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
                    <div class="agreement-button">
                        <div
                            class="d-sm-none"
                            shared-button
                            sharedButtonType="primary"
                            sharedButtonSize="small"
                            sharedButtonHeight="44"
                        >
                            <div>동의하고 가입하기</div>
                        </div>
                        <div
                            class="d-none d-sm-flex"
                            shared-button
                            sharedButtonType="primary"
                            sharedButtonSize="medium"
                            sharedButtonHeight="52"
                        >
                            <div>동의하고 가입하기</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
