<div class="settings full-absolute d-flex flex-column">
    <header class="d-none d-lg-block"></header>

    <div class="flex-fill d-flex">
        <div class="nav d-none d-lg-block">
            <div class="menu shared-typo-body-m14" [routerLink]="['/settings/profile']" routerLinkActive="selected">
                프로필 변경
            </div>
            <div class="menu shared-typo-body-m14" [routerLink]="['/settings/account']" routerLinkActive="selected">
                계정 관리
            </div>
            <div
                class="menu shared-typo-body-m14"
                [routerLink]="['/settings/notification']"
                routerLinkActive="selected"
            >
                알림 설정
            </div>
            <div class="menu shared-typo-body-m14" [routerLink]="['/settings/language']" routerLinkActive="selected">
                언어 설정
            </div>
            <div
                class="menu shared-typo-body-m14"
                [routerLink]="['/settings/service-center']"
                routerLinkActive="selected"
            >
                고객 센터
            </div>
            <div class="menu shared-typo-body-m14" [routerLink]="['/settings/company']" routerLinkActive="selected">
                회사 정보
            </div>
            <div class="menu shared-typo-body-m14">로그아웃</div>
        </div>
        <div class="flex-fill" style="position: relative">
            <div class="section full-absolute">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>

    <bottom-nav class="d-block d-lg-none"></bottom-nav>
</div>

<div class="drawer-wrapper" [class.drawer-wrapper-open]="variables.isDrawerOpen" (click)="closeDrawer()"></div>
<div class="drawer" [class.drawer-open]="variables.isDrawerOpen">
    <drawer></drawer>
</div>
