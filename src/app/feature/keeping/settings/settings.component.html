<div class="settings full-absolute d-flex flex-column">
    <header class="d-none d-lg-block"></header>

    <div class="flex-fill d-flex">
        <div class="nav d-none d-lg-block">
            <div class="menu" [routerLink]="['/settings/profile']" routerLinkActive="selected">
                {{ 'settings.nav.profile' | translate }}
            </div>
            <div class="menu" [routerLink]="['/settings/account']" routerLinkActive="selected">
                {{ 'settings.nav.account' | translate }}
            </div>
            <div class="menu" [routerLink]="['/settings/language']" routerLinkActive="selected">
                {{ 'settings.nav.language' | translate }}
            </div>
            <div class="h-line"></div>
            <div class="menu">{{ 'settings.nav.signout' | translate }}</div>
        </div>
        <div class="flex-fill" style="position: relative">
            <div class="section full-absolute">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>

    <bottom-nav class="d-block d-lg-none"></bottom-nav>
</div>

<div class="drawer-wrapper" [class.drawer-wrapper-open]="variables.isDrawerOpen" (click)="closeDrawer()"></div>
<div class="drawer" [class.drawer-open]="variables.isDrawerOpen">
    <drawer></drawer>
</div>
