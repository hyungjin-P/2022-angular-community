<div class="full-absolute d-flex flex-column">
  <mobile-header
    class="d-lg-none"
    [text]="'settings.mobile-header.profile' | translate"
    (goBack)="goBack()"
  ></mobile-header>

  <div class="flex-fill"
       style="position: relative">
    <div class="section full-absolute scroll-y">
      <div class="user-background"
           [style.background-image]="'url(' + user.background[0]?.url + ')'"
           [style.background-position]="'center'"
      >
        <div class="user-picture">
          <shared-avatar
            [image]="currentPicture"
            text="{{ user.email }}"
            size="80"
            fontSize="28"
          ></shared-avatar>
          <div class="camera"
               (click)="picture.click()">
            <span class="mdi mdi-camera"></span>
          </div>
          <input type="file"
                 accept="image/*"
                 #picture
                 (change)="onChangeFile(picture)"
                 hidden>
        </div>
      </div>

      <div class="profile">
        <div>
          <!-- 닉네임 -->
          <div class="nickname">
            <shared-input
              [label]="'settings.profile.nickname-label' | translate"
              [(ngModel)]="currentNickname"
              maxlength="20"
              [info]="'settings.profile.nickname-info' | translate"
              [error]="nicknameErrorText"
              (keyup)="onKeyup($event, 'nickname')"
            ></shared-input>
            <div class="duplicate-check" (click)="checkDuplicateNickname()">
              {{ 'settings.profile.duplicate-check' | translate }}
            </div>
          </div>
          <!-- 자기소개 -->
          <div class="about-me">
            <div class="label">{{ 'settings.profile.about-me-label' | translate }}</div>
            <textarea
              class="scroll-y"
              [class.textarea-error]="aboutMeErrorText"
              [placeholder]="'settings.profile.about-me-placeholder' | translate"
              [(ngModel)]="currentAboutMeText"
              maxlength="200"
            ></textarea>
            <div class="about-me-info" *ngIf="aboutMeInfoText && !aboutMeErrorText">
              <span class="mdi mdi-alert-circle-outline"></span>
              <div>{{ aboutMeInfoText }}</div>
            </div>
            <div class="about-me-error" *ngIf="aboutMeErrorText">
              <span class="mdi mdi-alert-circle-outline"></span>
              <div>{{ aboutMeErrorText }}</div>
            </div>
          </div>
          <!-- 프로필 수정 버튼 -->
          <a class="update-button shared-button-primary"
             [class.shared-button-primary-disabled]="!currentNickname"
             (click)="updateUser(picture)">
            <!-- 프로필 수정 완료-->
            <div>{{ 'settings.profile.update-button' | translate }}</div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
