<div class="full-absolute d-flex flex-column">
  <mobile-header
    class="d-lg-none"
    [text]="'settings.mobile-header.change-password' | translate"
    (goBack)="goBack()"
  ></mobile-header>

  <div class="flex-fill" style="position: relative">
    <div class="section full-absolute scroll-y">
      <div class="change-password">
        <div>
          <div class="text-1 d-none d-lg-block">
            <span>{{ 'settings.change-password.text-1' | translate }}</span>
            <div class="mdi mdi-chevron-left" (click)="goBack()"></div>
          </div>
          <div class="password">
            <shared-input
              type="text"
              [label]="'settings.change-password.password-label' | translate"
              [placeholder]="'settings.change-password.password-placeholder' | translate"
              [(ngModel)]="password"
              maxlength="15"
              *ngIf="passwordVisible"
              [error]="password != '' && passwordErrorText"
              (keyup)="onKeyup($event, 'password')"
            ></shared-input>
            <img
              class="password-icon-visible"
              src="assets/icons/etc/eye-visible.svg"
              (click)="changePasswordVisible()"
              *ngIf="passwordVisible">

            <shared-input
              type="password"
              [label]="'settings.change-password.password-label' | translate"
              [placeholder]="'settings.change-password.password-placeholder' | translate"
              [(ngModel)]="password"
              maxlength="15"
              *ngIf="!passwordVisible"
              [error]="password != '' && passwordErrorText"
              (keyup)="onKeyup($event, 'password')"
            ></shared-input>
            <img
              class="password-icon-invisible"
              src="assets/icons/etc/eye-invisible.svg"
              (click)="changePasswordVisible()"
              *ngIf="!passwordVisible">
          </div>
          <div class="new-password">
            <shared-input
              type="text"
              [label]="'settings.change-password.new-password-label' | translate"
              [placeholder]="'settings.change-password.new-password-placeholder' | translate"
              [(ngModel)]="newPassword"
              maxlength="15"
              *ngIf="newPasswordVisible"
              [error]="newPassword != '' && newPasswordErrorText"
              (keyup)="onKeyup($event, 'newPassword')"
            ></shared-input>
            <img
              class="password-icon-visible"
              src="assets/icons/etc/eye-visible.svg"
              (click)="changeNewPasswordVisible()"
              *ngIf="newPasswordVisible">

            <shared-input
              type="password"
              [label]="'settings.change-password.new-password-label' | translate"
              [placeholder]="'settings.change-password.new-password-placeholder' | translate"
              [(ngModel)]="newPassword"
              maxlength="15"
              *ngIf="!newPasswordVisible"
              [error]="newPassword != '' && newPasswordErrorText"
              (keyup)="onKeyup($event, 'newPassword')"
            ></shared-input>
            <img
              class="password-icon-invisible"
              src="assets/icons/etc/eye-invisible.svg"
              (click)="changeNewPasswordVisible()"
              *ngIf="!newPasswordVisible">
          </div>
          <div class="confirm-new-password">
            <shared-input
              type="text"
              [label]="'settings.change-password.confirm-new-password-label' | translate"
              [placeholder]="'settings.change-password.confirm-new-password-placeholder' | translate"
              [(ngModel)]="confirmNewPassword"
              maxlength="15"
              *ngIf="confirmNewPasswordVisible"
              [error]="confirmNewPassword != '' && confirmNewPasswordErrorText"
              (keyup)="onKeyup($event, 'confirmNewPassword')"
            ></shared-input>
            <img
              class="password-icon-visible"
              src="assets/icons/etc/eye-visible.svg"
              (click)="changeConfirmNewPasswordVisible()"
              *ngIf="confirmNewPasswordVisible">

            <shared-input
              type="password"
              [label]="'settings.change-password.confirm-new-password-label' | translate"
              [placeholder]="'settings.change-password.confirm-new-password-placeholder' | translate"
              [(ngModel)]="confirmNewPassword"
              maxlength="15"
              *ngIf="!confirmNewPasswordVisible"
              [error]="confirmNewPassword != '' && confirmNewPasswordErrorText"
              (keyup)="onKeyup($event, 'confirmNewPassword')"
            ></shared-input>
            <img
              class="password-icon-invisible"
              src="assets/icons/etc/eye-invisible.svg"
              (click)="changeConfirmNewPasswordVisible()"
              *ngIf="!confirmNewPasswordVisible">
          </div>
          <a
            class="update-button shared-button-primary"
            [class.shared-button-primary-disabled]="
                            !passwordValid ||
                            !newPasswordValid ||
                            !confirmNewPasswordValid ||
                            newPassword != confirmNewPassword
                        "
            (click)="changePassword()"
          >
            <div>{{ 'settings.change-password.update-button' | translate }}</div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
