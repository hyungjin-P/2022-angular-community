<shared-modal type="confirm"
              [(visible)]="feedDeleteModalVisible"
              [data]="feedDeleteMessage"
              (confirm)="deleteRealFeed()"
              (cancel)="modalCancel()"
></shared-modal>

<div class="items-title">
  <!-- breadcrumb -->
  <div class="title">
    <span class="title-content">피드</span>
    <span class="title-separate">-</span>
    <span class="title-active">피드 상세</span>
  </div>
</div>

<div class="items flex-wrap">

  <ng-container *ngFor="let feed of feedList">

    <!-- 피드 item -->
    <div class="item-list col-12">
      <div class="item-title">
        <div class="item-avatar"
             [ngStyle]="comparisonUserPicture(feed?.writer)"></div>
        <div
          class="item-nickname">
<!--          {{ feed?.writer?.nickname ? feed?.writer?.nickname : feed?.writer?.email }}-->
          {{ nowScroll }}
        </div>
        <div class="item-last-ago">
          {{ getTimeText(feed) }}
        </div>
        <div class="item-more-option">
          <div [inlineSVG]="'assets/icons/mypage/more-option-btn.svg'"
               tabindex="0"
               (click)="onPopoverToggle(feed)"
               (blur)="onClosePopover(feed)"></div>
          <app-mypage-popover [isVisible]="feed?.onCheckPopover"
                              (onClickModify)="moveModifyFeed(feed)"
                              (onClickDelete)="visibleFeedDeleteModal(feed)">
          </app-mypage-popover>
        </div>
      </div>

      <!-- 슬라이더 -->
      <div class="item-box">
        <div class="item-box-inner">
          <app-feed-slider [pictures]="feed?.pictures"
                           [isLike]="feed?.isLike"
                           [isBookmark]="feed?.isBookmark"
                           (onClickLike)="toggleFeedLike(feed)"
                           (onClickBookmark)="toggleFeedBookmark(feed)">
          </app-feed-slider>
        </div>
      </div>

      <div class="item-contents">
        <div class="item-contents-info">

          <div class="item-contents-like-avatar">
            <ng-container *ngFor="let likeUser of feed?.exposureUser">
              <div [ngStyle]="comparisonUserPicture(likeUser)"></div>
            </ng-container>
          </div>

          <div class="item-contents-texts">
            <ng-container *ngIf="feed.likeCount < 4 && feed.likeCount > 0">
              <strong>님</strong>이 좋아합니다.
            </ng-container>

            <ng-container *ngIf="feed.likeCount > 3">
              외 <strong> {{feed.likeCount}}명</strong>이 좋아합니다.
            </ng-container>
          </div>

          <div class="item-contents-comments">
            <i class="comment-icon"
               [inlineSVG]="'assets/icons/mypage/mypage-comment.svg'"></i>
            <span class="comment-count">
              {{ feed?.commentCount > 999 ? '999+' : feed?.commentCount }}
            </span>
          </div>
        </div>
        <div class="item-contents-text">
          <div>
            {{ feed?.content }}
          </div>
        </div>
        <div class="item-contents-tags">
          <span class="tag" *ngFor="let tag of feed?.tags">{{ '# ' + tag.name }}</span>
        </div>

      </div>

    </div>
  </ng-container>
</div>
