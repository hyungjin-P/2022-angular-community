<!-- 타이틀 -->
<div class="items-title">

  <!-- breadcrumb -->
  <div class="title">
    <span class="title-content">피드</span>
    <span class="content-count">{{feeds.length | number}}</span>
  </div>

  <a class="more-view">
    전체보기
  </a>
</div>

<!-- 등록한 피드 없을 때 -->
<div class="items" *ngIf="feedList.length === 0">
  <div class="item-empty">
    <div class="item-empty-title">
      {{ 'mypage.empty-text-1' | translate }}
    </div>
    <div class="item-empty-content">
      {{('mypage.empty-text-2' | translate)}}
    </div>
    <div class="item-empty-btns">
      <button type="button" (click)="goRouter('/write')">
        <span [inlineSVG]="'assets/icons/mypage/write_port.svg'"></span>
        <div>{{ 'mypage.write' | translate }}</div>
      </button>
    </div>
  </div>
</div>

<!-- 등록한 피드 있을 때 -->
<div class="items flex-wrap" *ngIf="feedList.length > 0">

  <div class="item-list col-6 col-lg-3"
       *ngFor="let feed of feedList; let i = index;">

    <div class="item-box"
         [style.background-image]="'url(' + feed?.picture + ')'"
         (click)="goRouter('/mypage/feed-detail')">

      <ng-container *ngIf="otherCount > 0 && (i + 1) === limit">
        <div class="item-box-other-count">
          <div class="other-count-num">
            {{ otherCount > 99 ? '99+' : (otherCount + '+') }}
          </div>
        </div>
      </ng-container>

    </div>

    <div class="item-content">

      <!-- url 넣어야 함 -->
      <div class="user-infos">
        <div class="avatar" style="background-image: url('assets/images/sample/feed_test_img_001.jpg')"></div>
        <div class="nickname">{{ user.nickname ? user.nickname : user.email }}</div>
      </div>

      <div class="user-contents">
        {{ feed.content }}
      </div>

      <div class="user-contents-infos">
        <div class="info-icon heart" [inlineSVG]="'assets/icons/mypage/mypage-heart.svg'"></div>
        <div class="info-count">99+</div>
        <div class="info-icon" [inlineSVG]="'assets/icons/mypage/mypage-content.svg'"></div>
        <div class="info-count">99+</div>
      </div>

    </div>
  </div>

</div>
