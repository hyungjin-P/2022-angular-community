<!-- 마이페이지 피드 목록형 -->

<!-- 타이틀 -->
<div class="items-title">

  <!-- breadcrumb -->
  <div class="title">
    <span class="title-content">피드</span>
    <span class="content-count">{{totalCount | number}}</span>
  </div>
<!-- 기존 전체보기 동작 주석처리
  &lt;!&ndash; 본인 것 &ndash;&gt;
  <ng-container *ngIf="!isOtherUser">
    <a class="more-view"
       [routerLink]="'/mypage/feed-detail'">
      {{ 'mypage.more' | translate}}
    </a>
  </ng-container>

  &lt;!&ndash; 다른 유저 것 &ndash;&gt;
  <ng-container *ngIf="isOtherUser">
    <a class="more-view"
       [routerLink]="'/mypage/feed-detail/' + isOtherUser">
      {{ 'mypage.more' | translate}}
    </a>
  </ng-container>-->

</div>

<!-- 등록한 피드 없을 때 -->
<div class="items justify-content-center"
     *ngIf="feedList.length === 0">

  <!-- 본인 것 -->
  <ng-container *ngIf="!isOtherUser">
    <div class="item-empty">
      <div class="item-empty-title">
        {{ 'mypage.empty-text-1' | translate }}
      </div>
      <div class="item-empty-content">
        {{('mypage.empty-text-2' | translate)}}
      </div>
      <div class="item-empty-btns d-none d-lg-flex">
        <button type="button" (click)="goRouter('/write')">
          <span [inlineSVG]="'assets/icons/mypage/pensil-color.svg'"></span>
          <div>{{ 'mypage.write' | translate }}</div>
        </button>
      </div>
    </div>
  </ng-container>

  <!-- 다른 유저 것 -->
  <ng-container *ngIf="isOtherUser">
    <div class="item-empty">
      <div class="item-empty-content">
        {{('mypage.empty-text-3' | translate)}}
      </div>
    </div>
  </ng-container>

</div>

<!-- 등록한 피드 있을 때 -->
<div class="items flex-wrap"
     *ngIf="feedList.length > 0">

  <div class="item-list col-6 col-lg-3"
       *ngFor="let feed of feedList; let i = index;">

    <div class="item-box"
         [ngStyle]="comparisonBackgroundImage(feed)"
         (click)="feedDetailModalShow(feed.id)"
    >

      <div class="item-box-picture-count d-lg-none"
           *ngIf="feed?.pictureCount > 1">
        {{ feed?.pictureCount > 99 ? '99+' : ('+' + feed?.pictureCount) }}
      </div>

      <ng-container *ngIf="otherCount > 0 && (i + 1) === limit">
        <div class="item-box-other-count">
          <div class="other-count-num">
            {{ otherCount > 99 ? '99+' : (otherCount + '+') }}
          </div>
        </div>
      </ng-container>
    </div>

  </div>

  <!-- 사진 없는 것 12개까지 증축하기 -->
  <ng-container *ngIf="feedList?.length <= limit">
    <div class="item-list col-6 col-lg-3 d-none d-lg-block"
         *ngFor="let dummy of ' '.repeat(limit - feedList.length).split(''); let x = index"
    >
      <div class="item-box" style="cursor: default"></div>
    </div>
  </ng-container>
</div>

<!-- 피드 상세 모달 컴포넌트 -->
<app-feed-detail-modal
  (prev)="feedDetailModalPrev()"
  (next)="feedDetailModalNext()"
  #feedDetailModal
></app-feed-detail-modal>
