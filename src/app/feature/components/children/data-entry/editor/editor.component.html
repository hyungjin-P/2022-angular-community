<div class="title">Input</div>
<div class="_content">
    <div class="editor">
        <div class="content" #contentElement dragula="ITEMS"></div>
        <div class="content-type-box">
            <div class="content-type" (click)="insertParagraph()">
                <div class="mdi mdi-format-title"></div>
                <div>텍스트</div>
            </div>
            <div class="content-type" (click)="singleImageElement.click()">
                <div class="mdi mdi-tooltip-image"></div>
                <div>이미지</div>
            </div>
            <input type="file" accept="image/*" #singleImageElement (change)="insertSingleImage()" hidden />
        </div>
    </div>
</div>
