<div class="title">Checkbox</div>

    <shared-checkbox text="Action Text" [checked]="checkbox" (click)="clickCheckbox()"></shared-checkbox>

    <shared-checkbox text="Action Text" [checked]="false" [disabled]="true"></shared-checkbox>
</div>
