<div class="title">Modal</div>
<div class="content">
    <div class="shared-button-primary" (click)="showAlertModal()">Alert</div>
    <shared-modal
        [(visible)]="isAlertModalVisible"
        [data]="alertModalData"
        type="alert"
        (cancel)="alertModalCancel()"
        (confirm)="alertModalOk()"
    ></shared-modal>

    <div class="shared-button-primary" (click)="showConfirmModal()">Confirm</div>
    <shared-modal
        [(visible)]="isConfirmModalVisible"
        [data]="confirmModalData"
        type="confirm"
        (cancel)="confirmModalCancel()"
        (confirm)="confirmModalOk()"
    ></shared-modal>

  <div class='shared-button-primary' (click)='showLoginModal()'>Login</div>
  <shared-login-modal
    [(visible)]='isLoginModalVisible'
    type='login'
    (cancel)='loginModalCancel()'
    (confirm)='loginModalConfirm()'
    (another)='loginModalAnother()'
  ></shared-login-modal>
</div>
