<div class="title">Modal</div>
<div class="content">
    <div
        shared-button
        sharedButtonType="primary"
        sharedButtonSize="small"
        sharedButtonWidth="160"
        sharedButtonHeight="44"
        (click)="showAlertModal()"
    >
        Alert
    </div>
    <shared-modal
        [(visible)]="isAlertModalVisible"
        [data]="alertModalData"
        type="alert"
        (cancel)="alertModalCancel()"
        (confirm)="alertModalOk()"
    ></shared-modal>

    <div
        shared-button
        sharedButtonType="primary"
        sharedButtonSize="small"
        sharedButtonWidth="160"
        sharedButtonHeight="44"
        (click)="showConfirmModal()"
    >
        Confirm
    </div>
    <shared-modal
        [(visible)]="isConfirmModalVisible"
        [data]="confirmModalData"
        type="confirm"
        (cancel)="confirmModalCancel()"
        (confirm)="confirmModalOk()"
    ></shared-modal>
</div>
