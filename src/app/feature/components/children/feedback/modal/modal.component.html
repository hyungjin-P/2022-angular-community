<div class="title">Modal</div>
<div class="content">
    <div
        shared-button
        sharedButtonType="primary"
        sharedButtonSize="small"
        sharedButtonWidth="160"
        sharedButtonHeight="44"
        (click)="showModal()"
    >
        Alert
    </div>
    <shared-modal
        [(visible)]="isVisible"
        [data]="visibleData"
        type="alert"
        (cancel)="handleCancel()"
        (confirm)="handleOk()"
    ></shared-modal>
    <div
        shared-button
        sharedButtonType="primary"
        sharedButtonSize="small"
        sharedButtonWidth="160"
        sharedButtonHeight="44"
        (click)="showModal2()"
    >
        Confirm
    </div>
    <shared-modal
        [(visible)]="isVisible2"
        [data]="visibleData2"
        type="confirm"
        (cancel)="handleCancel2()"
        (confirm)="handleOk2()"
    ></shared-modal>
</div>
