<div class="shared-modal-background" #modalBackgroundElement></div>
<div
  class="shared-modal-wrapper justify-content-center align-items-center"
  tabindex="-1"
  (keyup.escape)="onCancel()"
  (click)="onCancel()"
  #modalWrapperElement
>
  <div class="shared-modal user-select-none" (click)="$event.stopPropagation()">
    <div class="d-flex justify-content-end">
      <a class="close" (click)='onCancel()'>
        <img src='assets/icons/etc/close-button.svg' alt=''>
      </a>
    </div>
    <div class="d-flex justify-content-center">
      <img src="assets/icons/etc/login_modal.svg" />
    </div>
    <div class="text">{{ 'common.login-modal.text' | translate }}</div>
    <div class="sub-text">{{ 'common.login-modal.subText' | translate }}</div>
    <div class="button-group">
      <a class="shared-button-primary" (click)="onConfirm()">
        {{ 'common.login-modal.confirmBtnText' | translate }}
      </a>
    </div>
    <div class='another'>
      <span>{{'common.login-modal.anotherText' | translate }}</span>
      <a class='another-button' (click)='onAnother()'>{{'common.login-modal.anotherBtnText' | translate}}</a>
    </div>
  </div>
</div>
