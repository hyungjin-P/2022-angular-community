<div
    class="keeping-checkbox d-flex align-items-center user-select-none"
    [class.checked]="checked"
    [class.disabled]="disabled"
>
    <div class="box d-flex justify-content-center align-items-center">
        <div class="checkmark"></div>
    </div>
    <div class="text keeping-typo-bodytext1" *ngIf="text">{{ text }}</div>
</div>
