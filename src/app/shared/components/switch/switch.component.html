<div
    class="shared-switch d-flex align-items-center user-select-none"
    [class.checked]="isChecked"
    [class.disabled]="disabled"
    [class.size-small]="size == 'small'"
    (click)="onChanged(!isChecked)"
>
    <div class="switch">
        <input type="checkbox" [checked]="isChecked" [disabled]="disabled" />
        <div class="box" [class.checked]="isChecked">
            <div class="circle"></div>
        </div>
    </div>
    <div
        class="text"
        [class.shared-typo-body-m12]="size == 'small'"
        [class.shared-typo-body-m14]="size == 'default'"
        *ngIf="text"
    >
        {{ text }}
    </div>
</div>
