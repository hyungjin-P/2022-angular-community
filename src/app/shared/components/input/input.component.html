<div class="shared-input">
    <div class="label" [class.disabled]="disabled" *ngIf="label">{{ label }}</div>
    <input
        [type]="type"
        [class.input-error]="error"
        [placeholder]="placeholder"
        [ngModel]="text"
        [maxlength]="maxlength"
        [disabled]="disabled"
        (ngModelChange)="onChanged($event)"
    />
    <div class="info" *ngIf="info && !error">
        <span class="mdi mdi-alert-circle-outline"></span>
        <div>{{ info }}</div>
    </div>
    <div class="error" *ngIf="error">
        <span class="mdi mdi-alert-circle-outline"></span>
        <div>{{ error }}</div>
    </div>
</div>
