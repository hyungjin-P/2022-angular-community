<div class="modal fade" id="bs-feed-like-user-modal" data-keyboard="false" tabindex="-1"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullsize"
       id="bs-feed-like-user-modal-dialog">

    <div class="modal-content modal-fullsize animate-bottom"
         id="bs-feed-like-user-modal-content">

      <!-- 제목 영역 -->
      <div class="modal-header">

        <!-- 제목 -->
        <h5 class="modal-title"
            id="staticBackdropLabel">
          <span class="chevron-left"
                [inlineSVG]="'assets/icons/mypage/chevron-left-arrow.svg'"></span>
          <span>
            <!-- 댓글 -->
            이 글을 좋아하는 유저
          </span>
        </h5>

        <!-- 닫기 버튼 -->
        <button type="button"
                class="close">
          <span aria-hidden="true">&times;</span>
        </button>

      </div>

      <div class="modal-body">
      </div>

    </div>

  </div>

</div>
