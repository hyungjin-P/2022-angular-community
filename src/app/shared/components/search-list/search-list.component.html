<mat-selection-list #lists class="list-group scroll-y"
                    [ngModel]="selectedOptions"
                    (ngModelChange)="onNgModelChange($event)"
                    [multiple]="false"
                    [style.display]="visible ? 'block' : 'none'">
  <mat-list-option class="list-group-item"
                   *ngFor="let listItem of list"
                   [value]="listItem"
  >
    <div>{{'# ' + listItem.name}}</div>
    <div>{{listItem.tagCount + '개'}}</div>
  </mat-list-option>
</mat-selection-list>
