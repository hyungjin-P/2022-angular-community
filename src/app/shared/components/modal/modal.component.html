<div class="tf-modal-background" #modalBackgroundElement></div>
<div class="tf-modal-wrapper justify-content-center align-items-center" (click)="onCancel()" #modalWrapperElement>
    <div class="tf-modal user-select-none" (click)="$event.stopPropagation()">
        <div class="text tf-typo-title1 d-flex justify-content-center">{{ data?.text }}</div>
        <div class="sub-text tf-typo-subtext2 d-flex justify-content-center">{{ data?.subText }}</div>
        <div class="button-group d-flex">
            <div
                class="cancel col d-flex justify-content-center align-items-center tf-typo-bodytext2"
                *ngIf="type == 'type1'"
                (click)="onCancel()"
            >
                {{ data?.cancelButtonText || '취소' }}
            </div>
            <div
                class="confirm col d-flex justify-content-center align-items-center tf-typo-bodytext2"
                (click)="onConfirm()"
            >
                {{ data?.confirmButtonText || '확인' }}
            </div>
        </div>
    </div>
</div>
