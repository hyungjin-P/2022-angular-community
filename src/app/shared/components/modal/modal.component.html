<div class="shared-modal-background" #modalBackgroundElement></div>
<div class="shared-modal-wrapper justify-content-center align-items-center" (click)="onCancel()" #modalWrapperElement>
    <div class="shared-modal user-select-none" [class.alert-modal]="type == 'alert'" (click)="$event.stopPropagation()">
        <div class="d-flex justify-content-center">
            <img src="assets/icons/etc/emoji_smail.png" />
        </div>
        <div class="text shared-typo-body-b15 d-flex justify-content-center">{{ data?.text }}</div>
        <div class="sub-text shared-typo-body-m13 d-flex justify-content-center">{{ data?.subText }}</div>
        <div class="button-group d-flex justify-content-between">
            <div class="cancel-button" *ngIf="type == 'confirm'" (click)="onCancel()">
                <div>{{ data?.cancelButtonText || '취소' }}</div>
            </div>
            <div class="confirm-button" (click)="onConfirm()">
                <div>{{ data?.confirmButtonText || '확인' }}</div>
            </div>
        </div>
    </div>
</div>
