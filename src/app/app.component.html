<div [class.touch-screen]="variables.isTouchScreen">
  <router-outlet></router-outlet>
</div>
<div class="feedback-container">
    <shared-modal
        [(visible)]="modal['data']"
        [data]="modal['data']"
        type="alert"
        (cancel)="hideModal()"
        (confirm)="hideModal()"
    ></shared-modal>
    <shared-toast
        [(visible)]="toast['visible']"
        [text]="toast['text']"
        delay="3000"
        (cancel)="hideToast()"
    ></shared-toast>
</div>
